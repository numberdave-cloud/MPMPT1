<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Anatomy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1E1A17;
    --text: #EAE0D0;
    --text-dim: rgba(234, 224, 208, 0.72);
    --text-faint: rgba(234, 224, 208, 0.48);
    --accent: #C07838;
    --accent-glow: #D8904A;
    --glow-rgb: 216, 144, 74;
    --border: rgba(234, 224, 208, 0.30);
    --border-bright: rgba(234, 224, 208, 0.6);
    --frame: #0E0C0A;
    --led-off: rgba(234, 224, 208, 0.07);
    --cols: 96px repeat(16, minmax(0, 1fr));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding: 14px; display: flex; justify-content: center; }

  .rack { position: relative; width: 100%; max-width: 780px; background: var(--bg); border: 2px solid var(--frame); border-radius: 24px; padding: 22px 26px 20px; }
  .rack::after { content: ""; position: absolute; inset: 6px; border-radius: 18px; border: 1px solid rgba(234,224,208,0.18); pointer-events: none; }

  .head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .title { font-size: 12px; letter-spacing: 0.22em; font-weight: 600; text-transform: uppercase; }
  .transport { display: flex; align-items: center; gap: 10px; }
  .btn { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; font-family: inherit; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: border-color 0.08s, background 0.08s, color 0.08s; }
  .btn:hover { border-color: var(--border-bright); }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .btn.on { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; box-shadow: 0 0 10px rgba(var(--glow-rgb),0.35); }
  .btn.play { min-width: 74px; }
  .fader { display: flex; align-items: center; gap: 8px; margin-right: 6px; }
  .fader-label { font-size: 9px; letter-spacing: 0.16em; color: var(--text-dim); text-transform: uppercase; }
  .fader-val { font-family: 'Courier New', monospace; font-size: 11px; color: var(--accent-glow); text-shadow: 0 0 8px rgba(var(--glow-rgb),0.45); min-width: 52px; letter-spacing: 0.06em; }
  input[type=range].fader-in { -webkit-appearance: none; appearance: none; width: 120px; height: 22px; background: transparent; cursor: pointer; }
  input[type=range].fader-in::-webkit-slider-runnable-track { height: 3px; background: var(--border-bright); border-radius: 2px; }
  input[type=range].fader-in::-moz-range-track { height: 3px; background: var(--border-bright); border-radius: 2px; }
  input[type=range].fader-in::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 22px; margin-top: -9.5px; border-radius: 3px; background: linear-gradient(to right, var(--accent) 0 44%, var(--bg) 44% 56%, var(--accent) 56% 100%); border: 1px solid var(--accent-glow); box-shadow: 0 0 8px rgba(var(--glow-rgb),0.45); }
  input[type=range].fader-in::-moz-range-thumb { width: 14px; height: 22px; border-radius: 3px; background: linear-gradient(to right, var(--accent) 0 44%, var(--bg) 44% 56%, var(--accent) 56% 100%); border: 1px solid var(--accent-glow); box-shadow: 0 0 8px rgba(var(--glow-rgb),0.45); }
  input[type=range].fader-in:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }

  .lede { font-size: 12px; line-height: 1.5; color: var(--text-dim); margin: 8px 0 12px; max-width: 70ch; }


  .bar-controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--text-dim); border: none; border-right: 1px solid var(--border); padding: 7px 12px; font-family: inherit; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: color 0.1s, background 0.1s; }
  .seg button:last-child { border-right: none; }
  .seg button:hover { color: var(--text); }
  .seg button:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .seg button.active { background: var(--accent); color: var(--bg); font-weight: 600; }

  .overlay-intro { font-size: 12px; line-height: 1.5; color: var(--text-dim); margin-bottom: 8px; max-width: 72ch; }

  /* shared column grid */
  .row { display: grid; grid-template-columns: var(--cols); align-items: stretch; }
  .row-label { display: flex; align-items: center; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); padding-right: 8px; white-space: nowrap; overflow: hidden; }
  .row-label .alt { display: none; }

  /* overlay area */
  .overlay { margin-bottom: 8px; }
  .orow { cursor: pointer; border-radius: 6px; transition: background 0.08s; }
  .orow:hover { background: rgba(234,224,208,0.05); }
  .orow:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .orow.sel .row-label { color: var(--accent-glow); }
  .oblk { height: 28px; margin: 2px; border: 1.5px solid var(--border); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--text-dim); transition: background 0.05s, border-color 0.08s, color 0.08s; }
  .orow.sel .oblk { border-color: var(--accent); color: var(--text); }
  .oblk.lit { background: var(--accent); border-color: var(--accent); color: var(--bg); box-shadow: 0 0 8px rgba(var(--glow-rgb),0.4); }
  .oblk.empty { border-color: transparent; }
  .oblk.syl { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; text-transform: none; letter-spacing: 0; }

  /* elements overlay */
  .elem-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .mark { height: 26px; margin: 2px; display: flex; align-items: center; justify-content: center; }
  .mark .dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--border-bright); }
  .mark.on .dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(var(--glow-rgb),0.5); }
  .mark.on.lit .dot { background: var(--accent-glow); transform: scale(1.35); }

  /* sequencer grid */
  .seq { border-top: 1px solid var(--border); padding-top: 6px; }
  .ruler .rl { font-family: 'Courier New', monospace; font-size: 11px; color: var(--text-dim); letter-spacing: 0.04em; height: 18px; display: flex; align-items: flex-end; justify-content: center; }
  .ruler .rl.beat { color: var(--text); font-weight: 700; }
  .cell { height: 36px; margin: 2px; border: 1.5px solid var(--border); border-radius: 6px; position: relative; transition: background 0.05s; }
  .cell.beat { border-left-color: var(--border-bright); }
  .cell.hit { background: rgba(192,120,56,0.85); border-color: var(--accent); }
  .cell.hit.lit { background: var(--accent-glow); border-color: var(--accent-glow); box-shadow: 0 0 10px rgba(var(--glow-rgb),0.6); }
  .cell.hit.muted { background: rgba(234,224,208,0.08); border-color: var(--border); }
  .cell.head { background: rgba(234,224,208,0.10); }
  .seq.secret .cell.editable { cursor: pointer; }
  .seq.secret .cell.editable:hover:not(.hit) { border-color: var(--border-bright); background: rgba(234,224,208,0.05); }
  .seq.secret .cell.editable:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .cell.hit.head:not(.lit) { background: var(--accent); }

  /* (piano roll view removed) */

  /* info panel */
  .info { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); min-height: 60px; }
  .info-empty { font-size: 12px; color: var(--text-dim); font-style: italic; }
  .info-name { font-size: 15px; font-weight: 500; margin-bottom: 5px; }
  .info-name .alt { color: var(--text-dim); font-weight: 400; font-size: 13px; }
  .info-body { font-size: 12.5px; line-height: 1.55; color: var(--text); max-width: 74ch; }

  @media (max-width: 560px) {
    :root { --cols: 58px repeat(16, minmax(0, 1fr)); }
    .rack { padding: 18px 16px 16px; }
    .oblk.syl { font-size: 10px; }
    .row-label { font-size: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="rack" id="rack">
  <div class="head">
    <div class="title">Bar Anatomy</div>
    <div class="transport">
      <div class="fader">
        <span class="fader-label">Master</span>
        <input type="range" class="fader-in" id="master" min="-36" max="0" step="1" value="-6" aria-label="Master volume">
        <span class="fader-val" id="masterVal">-6 dB</span>
      </div>
      <button class="btn play" id="playBtn" aria-pressed="false">Play</button>
    </div>
  </div>
  <div class="lede">Here we have a bar of 4/4 that is looping. Change the overlay to see the way the bar is divided, the counting system that goes with it, and the names given to its beats. This device is for listening and exploring, and we will get to editing soon.</div>

  <div class="bar-controls">
    <div class="seg" id="overlayTabs" role="tablist">
      <button data-ov="div" class="active" role="tab">Grid divisions</button>
      <button data-ov="count" role="tab">Counting the bar</button>
      <button data-ov="elem" role="tab">Elements of a bar</button>
    </div>
  </div>

  <div class="overlay-intro" id="overlayIntro"></div>
  <div class="overlay" id="overlay"></div>

  <div class="seq" id="seq"></div>

  <div class="info" id="info"></div>
</div>

  // ─── COPY ────────────────────────────────────────────────────────
  const COPY = {

    div: {

        { id: 'e',  label: 'Eighths',    name: 'Eighths',    alt: '1 & 2 & 3 & 4 &',    body: 'An \u201Cand\u201D goes between each number to mark the halfway point between beats, so the count becomes one and two and three and four and.' },
        { id: 's',  label: 'Sixteenths', name: 'Sixteenths', alt: '1 e & a 2 e & a',    body: 'The syllables \u201Ce\u201D and \u201Ca\u201D sit on either side of the \u201Cand\u201D, so the count becomes one e and a, two e and a, and so on. Every sixteenth in the bar has a name at this level. Hits that feel slightly off or out usually sit on an \u201Ce\u201D or an \u201Ca\u201D, and as you get familiar with the count you will start recognising them by feel.' }

  // Syllable per step for each counting level.
  const SYL = {
    q: { 0:'1', 4:'2', 8:'3', 12:'4' },
    e: { 0:'1', 2:'&', 4:'2', 6:'&', 8:'3', 10:'&', 12:'4', 14:'&' },
    s: { 0:'1',1:'e',2:'&',3:'a',4:'2',5:'e',6:'&',7:'a',8:'3',9:'e',10:'&',11:'a',12:'4',13:'e',14:'&',15:'a' }
  };
  const SYL_SAMPLE = { '1':'one', '2':'two', '3':'three', '4':'four', 'e':'e', '&':'and', 'a':'a' };

  // ─── STATE ───────────────────────────────────────────────────────
  const state = {
    overlay: 'div',     // div | count | elem
    sel: null,          // selected item id within current overlay, or null
    playing: false,
    step: -1,
    secret: false,      // voice sequencer mode (unlocked by tapping the counting tab, resets on refresh)
    taps: 0
  };

  // ─── AUDIO ───────────────────────────────────────────────────────
  let ctx = null, master = null;
  const voiceBuf = {};
  let voiceReady = false;
  let lastVoice = null;

  function ensureCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = dbToGain(+$master.value); master.connect(ctx.destination);
      const drums = ctx.createGain(); drums.gain.value = DRUM_BASE; drums.connect(master);
      ctx._drums = drums;
    }
    return ctx;
  }

  const DRUM_BASE = 0.9;
  const DUCK_DB = { div: -18, count: -10 }; // drum drop while a row is selected in that overlay
  function dbToGain(db) { return Math.pow(10, db / 20); }
  function updateDuck() {
    if (!ctx) return;
    const db = state.sel && DUCK_DB[state.overlay] !== undefined ? DUCK_DB[state.overlay] : 0;
    ctx._drums.gain.setTargetAtTime(DRUM_BASE * dbToGain(db), ctx.currentTime, 0.04);
  }

  function b64ToBuf(b64) {
    const bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  async function loadVoices() {
    if (voiceReady) return;
    const c = ensureCtx();
    const keys = Object.keys(VOICE);
    await Promise.all(keys.map(async k => {
      try { voiceBuf[k] = await c.decodeAudioData(b64ToBuf(VOICE[k])); } catch (e) {}
    }));
    voiceReady = true;
  }

  // Drum one-shots (Dave's samples), scheduled at absolute time t.
  const drumBuf = {};
  let drumsReady = false;
  async function loadDrums() {
    if (drumsReady) return;
    const c = ensureCtx();
    await Promise.all(Object.keys(DRUMS).map(async k => {
      try { drumBuf[k] = await c.decodeAudioData(b64ToBuf(DRUMS[k])); } catch (e) {}
    }));
    drumsReady = true;
  }
  const voxBuf = {};
  let voxReady = false;
  async function loadVox() {
    if (voxReady) return;
    const c = ensureCtx();
    await Promise.all(Object.keys(VOX).map(async k => {
      try { voxBuf[k] = await c.decodeAudioData(b64ToBuf(VOX[k])); } catch (e) {}
    }));
    voxReady = true;
  }
  function playDrum(key, t) {
    const b = state.secret ? voxBuf[key] : drumBuf[key]; if (!b) return;
    const s = ctx.createBufferSource(); s.buffer = b;
    s.connect(ctx._drums); s.start(t);
  }
  function playTick(t) {
    const o = ctx.createOscillator(), env = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 1500;
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(0.35, t + 0.001);
    env.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    o.connect(env); env.connect(master); o.start(t); o.stop(t + 0.05);
  }
  // Each syllable is shaped to fit its slot: full level, then a short fade
  // finishing just as the next syllable lands. No hard stops, so no clicks.
  function playVoice(key, t, slot) {
    const b = voiceBuf[key]; if (!b) return;
    const s = ctx.createBufferSource(); s.buffer = b;
    const g = ctx.createGain();
    const fade = Math.min(0.06, slot * 0.35);
    g.gain.setValueAtTime(1.0, t);
    g.gain.setValueAtTime(1.0, t + slot - fade);
    g.gain.linearRampToValueAtTime(0.0001, t + slot);
    s.connect(g); g.connect(master); s.start(t); s.stop(t + slot + 0.01);
    lastVoice = s;
  }

  // Which steps are audible right now (elements overlay solo).
  function soloSteps() {
    if (state.overlay !== 'elem' || !state.sel) return null;
    const it = COPY.elem.items.find(i => i.id === state.sel);
    return it ? new Set(it.steps) : null;
  }

  // ─── SCHEDULER ───────────────────────────────────────────────────
  const stepDur = 60 / BPM / 4;
  const LOOKAHEAD = 0.12, TIMER_MS = 25;
  let nextStep = 0, nextTime = 0, timer = null;
  const visQueue = [];

  function scheduleStep(step, t) {
    const solo = soloSteps();
    const audible = !solo || solo.has(step);
    LANES.forEach(l => {
      if (!l.steps.includes(step)) return;
      const g = audible ? 1 : 0;
      if (g === 0) return;
      playDrum(l.key, t);
    });
    if (state.overlay === 'div' && state.sel) {
      const row = COPY.div.rows.find(r => r.id === state.sel);
      if (row && step % (STEPS / row.n) === 0) playTick(t);
    }
    if (state.overlay === 'count' && state.sel && voiceReady) {
      const syl = SYL[state.sel][step];
      const slot = stepDur * (state.sel === 'q' ? 4 : state.sel === 's' ? 1 : 2);
      if (syl) playVoice(SYL_SAMPLE[syl], t, slot);
    }
    visQueue.push({ step, t });
  }

  function tick() {
    while (nextTime < ctx.currentTime + LOOKAHEAD) {
      scheduleStep(nextStep, nextTime);
      nextTime += stepDur;
      nextStep = (nextStep + 1) % STEPS;
    }
  }

  function drawLoop() {
    if (!state.playing) return;
    const now = ctx.currentTime;
    let cur = null;
    while (visQueue.length && visQueue[0].t <= now) cur = visQueue.shift();
    if (cur && cur.step !== state.step) { state.step = cur.step; paintStep(); }
    requestAnimationFrame(drawLoop);
  }

  async function start() {
    ensureCtx();
    if (ctx.state === 'suspended') await ctx.resume();
    updateDuck();
    await loadDrums();
    loadVoices();
    nextStep = 0; nextTime = ctx.currentTime + 0.06;
    visQueue.length = 0;
    state.playing = true; state.step = -1;
    timer = setInterval(tick, TIMER_MS); tick();
    requestAnimationFrame(drawLoop);
    $play.textContent = 'Stop'; $play.classList.add('on'); $play.setAttribute('aria-pressed', 'true');
  }
  function stop() {
    clearInterval(timer); timer = null;
    state.playing = false; state.step = -1;
    if (lastVoice) { try { lastVoice.stop(); } catch (e) {} lastVoice = null; }
    paintStep();
    $play.textContent = 'Play'; $play.classList.remove('on'); $play.setAttribute('aria-pressed', 'false');
  }

  // ─── DOM ─────────────────────────────────────────────────────────
  const $play = document.getElementById('playBtn');
  const $master = document.getElementById('master');
  const $masterVal = document.getElementById('masterVal');
  const $ovTabs = document.getElementById('overlayTabs');
  const $intro = document.getElementById('overlayIntro');
  const $overlay = document.getElementById('overlay');
  const $seq = document.getElementById('seq');
  const $info = document.getElementById('info');

  function rowEl(labelHtml, cls) {
    const r = document.createElement('div'); r.className = 'row ' + (cls || '');
    const l = document.createElement('div'); l.className = 'row-label'; l.innerHTML = labelHtml; r.appendChild(l);
    return r;
  }

  function buildOverlay() {
    $overlay.innerHTML = '';
    const ov = state.overlay;
    $intro.textContent = COPY[ov].intro;

    if (ov === 'div') {
      COPY.div.rows.forEach(row => {
        const r = rowEl(row.label, 'orow'); r.tabIndex = 0; r.dataset.id = row.id; r.setAttribute('role', 'button');
        const span = STEPS / row.n;
        for (let i = 0; i < row.n; i++) {
          const b = document.createElement('div'); b.className = 'oblk'; b.style.gridColumn = 'span ' + span;
          b.dataset.from = i * span; b.dataset.to = (i + 1) * span - 1;
          b.textContent = row.n === 1 ? '1 bar' : (row.n === 2 ? '1/2' : '1/' + row.n);
          r.appendChild(b);
        }
        wireRow(r, row.id);
        $overlay.appendChild(r);
      });
    } else if (ov === 'count') {
      COPY.count.rows.forEach(row => {
        const r = rowEl(row.label, 'orow'); r.tabIndex = 0; r.dataset.id = row.id; r.setAttribute('role', 'button');
        const map = SYL[row.id];
        for (let s = 0; s < STEPS; s++) {
          const b = document.createElement('div'); b.className = 'oblk syl'; b.dataset.from = s; b.dataset.to = s;
          if (map[s] !== undefined) b.textContent = map[s]; else b.classList.add('empty');
          r.appendChild(b);
        }
        wireRow(r, row.id);
        $overlay.appendChild(r);
      });
    } else {
      const btns = document.createElement('div'); btns.className = 'elem-btns';
      COPY.elem.items.forEach(it => {
        const b = document.createElement('button'); b.className = 'btn'; b.textContent = it.label; b.dataset.id = it.id;
        b.addEventListener('click', () => select(it.id));
        btns.appendChild(b);
      });
      $overlay.appendChild(btns);
      const r = rowEl('Markers', 'markers');
      for (let s = 0; s < STEPS; s++) {
        const m = document.createElement('div'); m.className = 'mark'; m.dataset.step = s;
        m.innerHTML = '<span class="dot"></span>'; r.appendChild(m);
      }
      $overlay.appendChild(r);
    }
    paintSelection();
  }

  function wireRow(r, id) {
    r.addEventListener('click', () => select(id));
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(id); } });
  }

  function buildSeq() {
    $seq.innerHTML = '';
    const ruler = rowEl('', 'ruler');
    for (let s = 0; s < STEPS; s++) {
      const c = document.createElement('div'); c.className = 'rl' + (s % 4 === 0 ? ' beat' : '');
      c.textContent = String(s + 1);
      ruler.appendChild(c);
    }
    $seq.appendChild(ruler);
    LANES.forEach(l => {
      const r = rowEl(l.label, 'lane');
      for (let s = 0; s < STEPS; s++) {
        const c = document.createElement('div'); c.className = 'cell' + (s % 4 === 0 ? ' beat' : '') + (l.steps.includes(s) ? ' hit' : '');
        c.dataset.step = s; c.dataset.lane = l.key;
        if (state.secret) {
          c.classList.add('editable'); c.tabIndex = 0; c.setAttribute('role', 'button');
          c.addEventListener('click', () => toggleStep(l, s));
          c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleStep(l, s); } });
        }
        r.appendChild(c);
      }
      $seq.appendChild(r);
    });
  }

  function toggleStep(lane, s) {
    const i = lane.steps.indexOf(s);
    if (i >= 0) lane.steps.splice(i, 1); else lane.steps.push(s);
    const cell = $seq.querySelector('.cell[data-lane="' + lane.key + '"][data-step="' + s + '"]');
    if (cell) cell.classList.toggle('hit', i < 0);
    paintSelection();
  }

  function unlockSecret() {
    if (state.secret) return;
    state.secret = true;
    ensureCtx(); loadVox();
    $seq.classList.add('secret');
    buildSeq();
    document.querySelector('.title').textContent = 'Bar Anatomy: voice sequencer';
  }

  function select(id) {
    state.sel = (state.sel === id) ? null : id;
    if (state.overlay === 'count' && state.sel) loadVoices();
    updateDuck();
    paintSelection();
    paintInfo();
  }

  function paintSelection() {
    $overlay.querySelectorAll('.orow').forEach(r => r.classList.toggle('sel', r.dataset.id === state.sel));
    $overlay.querySelectorAll('.elem-btns .btn').forEach(b => b.classList.toggle('on', b.dataset.id === state.sel));
    const solo = soloSteps();
    $overlay.querySelectorAll('.mark').forEach(m => m.classList.toggle('on', !!solo && solo.has(+m.dataset.step)));
    $seq.querySelectorAll('.cell.hit').forEach(c => c.classList.toggle('muted', !!solo && !solo.has(+c.dataset.step)));
    paintStep();
  }

  function paintStep() {
    const s = state.step;
    $seq.querySelectorAll('.cell').forEach(c => {
      const on = +c.dataset.step === s;
      c.classList.toggle('head', on);
      c.classList.toggle('lit', on && c.classList.contains('hit') && !c.classList.contains('muted'));
    });
    $overlay.querySelectorAll('.orow').forEach(r => {
      const sel = r.classList.contains('sel');
      r.querySelectorAll('.oblk').forEach(b => {
        const inRange = s >= +b.dataset.from && s <= +b.dataset.to && !b.classList.contains('empty');
        b.classList.toggle('lit', sel && inRange);
      });
    });
    $overlay.querySelectorAll('.mark').forEach(m => m.classList.toggle('lit', +m.dataset.step === s));
  }

  function paintInfo() {
    const ov = state.overlay;
    if (!state.sel) { $info.innerHTML = '<div class="info-empty">' + COPY.placeholder + '</div>'; return; }
    const list = ov === 'elem' ? COPY.elem.items : COPY[ov].rows;
    const it = list.find(i => i.id === state.sel);
    if (!it) { $info.innerHTML = ''; return; }
    const alt = it.alt ? ' <span class="alt">(' + it.alt + ')</span>' : '';
    $info.innerHTML = '<div class="info-name">' + it.name + alt + '</div><div class="info-body">' + it.body + '</div>';
  }

  // ─── WIRE ────────────────────────────────────────────────────────
  $play.addEventListener('click', () => state.playing ? stop() : start());
  $ovTabs.addEventListener('click', e => {
    const b = e.target.closest('button[data-ov]'); if (!b) return;
    if (b.dataset.ov === 'count') { state.taps++; if (state.taps >= SECRET_TAPS) unlockSecret(); }
    state.overlay = b.dataset.ov; state.sel = null;
    updateDuck();
    $ovTabs.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    buildOverlay(); paintInfo();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sel) { state.sel = null; updateDuck(); paintSelection(); paintInfo(); } });
  $master.addEventListener('input', () => {
    $masterVal.textContent = $master.value + ' dB';
    if (ctx) master.gain.setTargetAtTime(dbToGain(+$master.value), ctx.currentTime, 0.02);
  });

  buildSeq(); buildOverlay(); paintInfo();
</script>
</body>
</html>
