<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Energy Dial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1E1A17;
    --text: #EAE0D0;
    --text-dim: rgba(234, 224, 208, 0.55);
    --text-faint: rgba(234, 224, 208, 0.3);
    --accent: #C07838;
    --accent-glow: #D8904A;
    --border: rgba(234, 224, 208, 0.15);
    --border-bright: rgba(234, 224, 208, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Transparent surround. Canvas wraps embeds in its own rounded grey
     container; a transparent page inherits that colour exactly, so the
     card sits directly on whatever Canvas paints. Do not set a colour
     here: any fixed value shows as a mismatched slab inside the
     wrapper (learned the hard way on scene-scorer-drive v1.6.2). */
  html, body {
    background: transparent;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding: 4px;
    max-width: 740px;
    margin: 0 auto;
  }

  /* Rack-hardware card: 24px radius, outer dark frame, inner 1px light
     stroke inset from the edge. The whole MOTE lives inside it. */
  .rack {
    position: relative;
    background: var(--bg);
    border: 2px solid #0B0907;
    border-radius: 24px;
    padding: 20px 24px 28px;
  }
  .rack::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(234, 224, 208, 0.3);
    border-radius: 18px;
    pointer-events: none;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-wrap: wrap;
  }

  .title {
    font-size: 13px;
    letter-spacing: 0.2em;
    font-weight: 600;
  }

  /* Letterbox crop, ported from scene-scorer-drive v1.6.1 and re-tuned
     to this upload. Measured from a live screenshot: 16:9 window
     1356px wide, baked bars 98px top and bottom, picture 2.40:1.
     As width fractions: player height 0.5625, picture 0.41667,
     bars 0.072917 each. Crop is asymmetric:
       top    = bar + 3% of picture = 0.085417  (buries title/channel text)
       bottom = bar + 2% of picture = 0.081250  (More Videos pill pokes
                ~3% above the bottom bar on this upload; Drive only
                needed exactly one bar)
     frame height = 0.5625 - 0.085417 - 0.08125 = 0.395833
     frame aspect = 1/0.395833 = 2.526
     top offset   = -0.085417/0.395833 = -21.58% */
  .video-wrap {
    --frame-aspect: 2.526;
    position: relative;
    width: 100%;
    aspect-ratio: var(--frame-aspect) / 1;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .video-wrap > div#scenePlayer,
  .video-wrap iframe {
    position: absolute;
    left: 0;
    top: -21.58%;
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    border: none;
  }

  /* Transparent shield: intercepts every mouse event so YouTube never
     receives them. No click-through at all: pausing is the transport
     button's job. Also stops hover from waking YouTube's chrome. */
  .click-shield {
    position: absolute;
    inset: 0;
    z-index: 2;
    cursor: default;
    background: transparent;
  }

  /* Opaque cover shown whenever the scene is not rolling. Hides the
     thumbnail/title chrome before start and the paused-state overlay
     (title, channel, More Videos) while paused or ended. */
  .video-cover {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    letter-spacing: 0.24em;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 500;
    transition: opacity 0.25s;
  }
  .video-cover.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Cycle fade scrim: sits above the iframe, below shield and cover.
     JS drives opacity with a per-phase transition duration. */
  .fade-scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #000;
    opacity: 0;
    pointer-events: none;
  }

  /* Transport demoted: small quiet row under the selector. */
  .transport {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }

  .transport-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 0.14em;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: 500;
    transition: border-color 0.08s;
  }
  .transport-btn:hover:not(:disabled) { border-color: var(--border-bright); }
  .transport-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ─── VOLUME KNOB ─── */
  .vol-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 6px;
  }
  .knob {
    width: 40px;
    height: 40px;
    border: 1px solid var(--border-bright);
    border-radius: 50%;
    position: relative;
    cursor: ns-resize;
    background: transparent;
    flex: none;
    touch-action: none;
    outline: none;
  }
  .knob:hover { border-color: var(--accent); }
  .knob:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(192,120,56,0.35); }
  .knob-indicator {
    position: absolute;
    left: calc(50% - 1px);
    top: 5px;
    width: 2px;
    height: 15px;
    background: var(--accent);
    border-radius: 1px;
    transform-origin: 50% 15px;
    transform: rotate(135deg);
  }
  .knob-label {
    font-size: 9px;
    letter-spacing: 0.16em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* Segment-style volume readout: mono digits in accent with soft glow,
     ghost segments behind at very low opacity. */
  .vol-readout {
    position: relative;
    font-family: 'Courier New', 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    min-width: 3ch;
    text-align: right;
  }
  .vol-readout .live {
    position: relative;
    z-index: 1;
    color: var(--accent);
    text-shadow: 0 0 7px rgba(216, 144, 74, 0.55);
  }
  .vol-readout .ghost {
    position: absolute;
    right: 0;
    top: 0;
    color: var(--text);
    opacity: 0.06;
  }

  .selector-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .selector-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* Selector is the feature: big primary buttons. */
  .selector {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }

  .sel-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-bright);
    border-radius: 6px;
    padding: 16px 26px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.14em;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: 600;
    flex: 1 1 auto;
    transition: background 0.08s, border-color 0.08s, transform 0.05s;
  }
  .sel-btn:hover:not(:disabled) { border-color: var(--accent); }
  .sel-btn:active:not(:disabled) { transform: translateY(1px); }
  .sel-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .sel-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  /* ─── SWITCH MODE TOGGLE ─── */
  .mode-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mode-toggle-label {
    font-size: 9px;
    letter-spacing: 0.16em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .mode-group {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .mode-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 7px 12px;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 0.12em;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: 500;
    transition: background 0.08s, color 0.08s;
  }
  .mode-btn.active {
    background: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }

  /* ─── TUNE PANEL (temporary testing scaffold) ───────────────────
     Collapsed disclosure for auditioning start times against the
     scene. Remove or leave collapsed for student release. */
  .tune {
    display: none;   /* tuning done; flip to block to re-tune start times */
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .tune-toggle {
    background: transparent;
    color: var(--text-faint);
    border: none;
    padding: 4px 0;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 0.16em;
    cursor: pointer;
    text-transform: uppercase;
  }
  .tune-toggle:hover { color: var(--text-dim); }
  .tune-toggle::before { content: '▸ '; }
  .tune.open .tune-toggle::before { content: '▾ '; }
  .tune-panel { display: none; padding-top: 10px; }
  .tune.open .tune-panel { display: block; }

  .tune-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .tune-row-label {
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    text-transform: uppercase;
    width: 72px;
    flex: none;
  }
  .tune-input {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: 'Courier New', 'IBM Plex Mono', monospace;
    font-size: 13px;
    width: 70px;
    text-align: center;
    outline: none;
  }
  .tune-input:focus { border-color: var(--accent); }
  .tune-nudge {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    min-width: 44px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: border-color 0.08s;
  }
  .tune-nudge:hover { border-color: var(--border-bright); }
  .tune-remaining {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    margin-left: auto;
    white-space: nowrap;
  }
  .tune-row.shortest .tune-remaining {
    color: var(--accent);
    text-shadow: 0 0 6px rgba(216, 144, 74, 0.4);
  }
  .tune-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .tune-readout {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }

  /* Off-screen audio-only music players. Kept in-viewport with near-zero
     opacity rather than display:none so the browser doesn't throttle playback. */
  .hidden-players {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 200px;
    height: 120px;
    opacity: 0.01;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
  }
  .hidden-players div { width: 200px; height: 120px; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    .transport-btn { padding: 11px 16px; }
  }
</style>
</head>
<body>
  <div class="rack">
  <div class="header">
    <div class="title">ENERGY DIAL</div>
  </div>

  <div class="video-wrap">
    <div id="scenePlayer"></div>
    <div class="fade-scrim" id="fadeScrim"></div>
    <div class="click-shield" id="clickShield"></div>
    <div class="video-cover" id="videoCover"><span id="coverLabel">LOADING</span></div>
  </div>

  <div class="selector-row">
    <div class="selector-label">Energy</div>
    <div class="mode-toggle">
      <div class="mode-toggle-label">Switching</div>
      <div class="mode-group" role="group" aria-label="Switch mode">
        <button class="mode-btn active" id="modeFromTop">From Top</button>
        <button class="mode-btn" id="modeSeamless">Seamless</button>
      </div>
    </div>
  </div>
  <div class="selector" id="selector"></div>

  <div class="transport">
    <button class="transport-btn" id="playBtn" disabled>LOADING</button>
    <button class="transport-btn" id="restartBtn" disabled>RESTART</button>
    <div class="vol-control">
      <div class="knob" id="volKnob" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" tabindex="0">
        <div class="knob-indicator" id="volIndicator"></div>
      </div>
      <div class="knob-label">Vol</div>
      <div class="vol-readout" aria-hidden="true"><span class="ghost">888</span><span class="live" id="volReadout">100</span></div>
    </div>
  </div>

  <div class="tune" id="tune">
    <button class="tune-toggle" id="tuneToggle">Tune start times</button>
    <div class="tune-panel" id="tunePanel"></div>
  </div>

  <div class="hidden-players" id="hiddenPlayers" aria-hidden="true"></div>
  </div><!-- /rack -->

<script>
  // ─── CONFIG ──────────────────────────────────────────────────────
  // This is the only block you edit per scene.
  //
  // ENERGY DIAL VARIANT. One running scene, three music beds spanning
  // energy levels. The scene's own audio is permanently muted: the beds
  // are the only sound. No temp-track button, no lockout.
  //
  //   scene.start    — seconds into the scene upload to begin
  //   tracks[].id    — YouTube video id for each music bed
  //   tracks[].volume— per-bed level, 0..100  (trim by ear)
  //   tracks[].label — button text students see
  //   tracks[].start — seconds into the bed to begin
  //   tracks[].sceneStart — optional: seconds into the SCENE when this
  //                     bed is chosen from the top (defaults to scene.start)
  //   startWith      — 0..n, bed selected on load
  //   fadeInMs       — every bed entrance fades in over this long
  //   fadeOutMs      — outgoing bed drops over this long on a switch
  //   fadeExp        — power curve exponent; 2 keeps the fade sounding
  //                     even instead of hanging near full level
  // The Vol knob on screen is a MASTER control that scales everything
  // together, so the balance you set above is preserved.
  const CONFIG = {
    scene:  { id: '6z9qws7M8q8', start: 70 },
    tracks: [
      { label: 'ENERGY 1', id: 'ZtbDetsudtI', volume: 100, start: 154 },
      { label: 'ENERGY 2', id: 'cLc37iEdMyg', volume: 100, start: 43.5 },
      { label: 'ENERGY 3', id: '7cx3cOVnV0g', volume: 100, start: 34.25 }
    ],
    startWith: 0,
    // Auto-cycle: when the SCENE's own clock reaches cycle.at seconds,
    // audio and picture fade out together over cycle.fadeMs, then the
    // next bed loads, everything resets to its start point and plays.
    // E1 -> E2 -> E3 -> E1 forever. Any interaction cancels an
    // in-progress fade; the watcher re-arms on the next run.
    cycle: { at: 180, fadeMs: 10000, refadeMs: 600 },
    fadeInMs: 1000,
    fadeOutMs: 150,
    fadeExp: 2
  };

  // ─── STATE ───────────────────────────────────────────────────────
  let scenePlayer = null;
  const musicPlayers = [];
  let readyCount = 0;
  const totalPlayers = 1 + CONFIG.tracks.length;
  let allReady = false;
  let isPlaying = false;
  let activeTrack = CONFIG.startWith;
  let masterVol = 100;
  let ccKilledOnce = false;
  let restartOnSwitch = true;           // FROM TOP mode by default
  let tuneRefreshRemaining = null;      // set by buildTunePanel
  let cycleWatch = null;                // interval polling scene time
  let cycleFading = false;              // inside the 10s end-fade
  let cycleAdvanceTO = null;            // timeout firing the advance
  let cycleGraceUntil = 0;              // ignore triggers briefly post-play
                                        // (seekTo can lag getCurrentTime)

  // ─── DOM REFS ────────────────────────────────────────────────────
  const $playBtn = document.getElementById('playBtn');
  const $restartBtn = document.getElementById('restartBtn');
  const $selector = document.getElementById('selector');
  const $hidden = document.getElementById('hiddenPlayers');
  const $shield = document.getElementById('clickShield');
  const $knob = document.getElementById('volKnob');
  const $indicator = document.getElementById('volIndicator');
  const $cover = document.getElementById('videoCover');
  const $coverLabel = document.getElementById('coverLabel');

  // ─── VIDEO COVER ─────────────────────────────────────────────────
  function showCover(label) {
    $coverLabel.textContent = label;
    $cover.classList.remove('hidden');
  }
  function hideCover() {
    $cover.classList.add('hidden');
  }

  // ─── VOLUME HELPERS ──────────────────────────────────────────────
  function effVol(base) {
    return Math.max(0, Math.min(100, Math.round(base * masterVol / 100)));
  }

  // ─── FADE ENGINE ─────────────────────────────────────────────────
  // Each bed carries a fade fraction 0..1. Applied volume is
  // effVol(bed volume) * frac^fadeExp, so the master knob keeps working
  // mid-fade. A single 30ms interval walks every frac toward its target
  // and stops itself when everything has arrived. Linear YouTube volume
  // holds near full perceived loudness until the last moment, hence the
  // power curve (same fix as the Quoter fades).
  const fades = CONFIG.tracks.map(() => ({ frac: 0, target: 0, msTotal: 1 }));
  let fadeTimer = null;
  let fadeLastT = 0;

  function bedVol(i) {
    return Math.round(effVol(CONFIG.tracks[i].volume) * Math.pow(fades[i].frac, CONFIG.fadeExp));
  }

  function applyBedVol(i) {
    const p = musicPlayers[i];
    if (!p) return;
    try {
      p.setVolume(bedVol(i));
      if (fades[i].frac > 0) p.unMute(); else p.mute();
    } catch (e) {}
  }

  function fadeTick() {
    const now = performance.now();
    const dt = now - fadeLastT;
    fadeLastT = now;
    let busy = false;
    fades.forEach((f, i) => {
      if (f.frac === f.target) return;
      const step = dt / f.msTotal;
      f.frac = f.frac < f.target
        ? Math.min(f.target, f.frac + step)
        : Math.max(f.target, f.frac - step);
      applyBedVol(i);
      if (f.frac !== f.target) busy = true;
    });
    if (!busy) { clearInterval(fadeTimer); fadeTimer = null; }
  }

  function startFade(i, target, ms) {
    const f = fades[i];
    f.target = target;
    if (ms <= 0) {
      f.frac = target;
      applyBedVol(i);
      return;
    }
    f.msTotal = ms;
    if (!fadeTimer) {
      fadeLastT = performance.now();
      fadeTimer = setInterval(fadeTick, 30);
    }
  }

  function applyMasterVol() {
    musicPlayers.forEach((p, i) => applyBedVol(i));
  }
  function setKnobVisual() {
    const angle = -135 + (masterVol / 100) * 270;
    $indicator.style.transform = 'rotate(' + angle + 'deg)';
    $knob.setAttribute('aria-valuenow', String(masterVol));
    document.getElementById('volReadout').textContent = String(masterVol);
  }
  function nudgeVol(delta) {
    masterVol = Math.max(0, Math.min(100, masterVol + delta));
    setKnobVisual();
    applyMasterVol();
  }

  // ─── AUDIO GATING ────────────────────────────────────────────────
  // One place decides who is audible. The scene is always muted; the
  // active bed fades in over fadeInMs, everything else drops fast.
  // fromSilence forces the incoming bed to enter from zero (fresh play,
  // restart, FROM TOP switch) rather than resuming a part-way fade.
  function applyAudioGate(fromSilence) {
    if (!scenePlayer) return;
    try { scenePlayer.mute(); } catch (e) {}
    musicPlayers.forEach((p, i) => {
      if (i === activeTrack) {
        if (fromSilence) { fades[i].frac = 0; applyBedVol(i); }
        startFade(i, 1, CONFIG.fadeInMs);
      } else {
        startFade(i, 0, CONFIG.fadeOutMs);
      }
    });
  }

  // ─── BUILD DOM FROM CONFIG ───────────────────────────────────────
  function buildDom() {
    CONFIG.tracks.forEach((t, i) => {
      const d = document.createElement('div');
      d.id = 'musicPlayer' + i;
      $hidden.appendChild(d);
    });

    CONFIG.tracks.forEach((t, i) => {
      const b = document.createElement('button');
      b.className = 'sel-btn';
      b.textContent = t.label;
      b.dataset.idx = String(i);
      b.disabled = true;
      $selector.appendChild(b);
    });

    $selector.addEventListener('click', (e) => {
      const btn = e.target.closest('.sel-btn');
      if (!btn) return;
      selectTrack(parseInt(btn.dataset.idx, 10));
    });
  }

  // ─── YT PLAYERS ──────────────────────────────────────────────────
  function onYouTubeIframeAPIReady() {
    const vars = { controls: 0, disablekb: 1, modestbranding: 1, rel: 0, playsinline: 1, fs: 0, iv_load_policy: 3, cc_load_policy: 0 };

    scenePlayer = new YT.Player('scenePlayer', {
      videoId: CONFIG.scene.id,
      playerVars: vars,
      events: { onReady: onSceneReady, onStateChange: onSceneStateChange }
    });

    CONFIG.tracks.forEach((t, i) => {
      musicPlayers[i] = new YT.Player('musicPlayer' + i, {
        videoId: t.id,
        playerVars: vars,
        events: { onReady: () => onMusicReady(i) }
      });
    });
  }

  function onSceneReady() {
    try { scenePlayer.mute(); } catch (e) {}
    if (CONFIG.scene.start) { try { scenePlayer.seekTo(CONFIG.scene.start, true); } catch (e) {} }
    markReady();
  }

  function onMusicReady(i) {
    const p = musicPlayers[i], t = CONFIG.tracks[i];
    try { p.setVolume(0); p.mute(); } catch (e) {}
    if (t.start) { try { p.seekTo(t.start, true); } catch (e) {} }
    markReady();
  }

  function markReady() {
    readyCount++;
    if (readyCount >= totalPlayers && !allReady) {
      allReady = true;
      $playBtn.textContent = 'PLAY';
      $playBtn.disabled = false;
      $restartBtn.disabled = false;
      $selector.querySelectorAll('.sel-btn').forEach(b => { b.disabled = false; });
      showCover('READY');
      setActiveTrackUI();
      // Durations can lag ready by a beat; poll a few times.
      let tries = 0;
      const t = setInterval(() => {
        if (tuneRefreshRemaining) tuneRefreshRemaining();
        if (++tries >= 5) clearInterval(t);
      }, 1000);
    }
  }

  // ─── CAPTIONS ────────────────────────────────────────────────────
  function killCaptions() {
    try { scenePlayer.unloadModule('captions'); } catch (e) {}
    try { scenePlayer.unloadModule('cc'); } catch (e) {}
  }

  // ─── AUTO-CYCLE ──────────────────────────────────────────────────
  const $scrim = document.getElementById('fadeScrim');

  function setScrim(opacity, ms) {
    $scrim.style.transition = 'opacity ' + ms + 'ms linear';
    // force style flush so a new transition duration takes effect
    void $scrim.offsetWidth;
    $scrim.style.opacity = String(opacity);
  }

  function beginCycleFade() {
    cycleFading = true;
    setScrim(1, CONFIG.cycle.fadeMs);
    startFade(activeTrack, 0, CONFIG.cycle.fadeMs);
    cycleAdvanceTO = setTimeout(advanceCycle, CONFIG.cycle.fadeMs + 60);
  }

  function advanceCycle() {
    cycleFading = false;
    if (cycleAdvanceTO) { clearTimeout(cycleAdvanceTO); cycleAdvanceTO = null; }
    activeTrack = (activeTrack + 1) % CONFIG.tracks.length;
    setActiveTrackUI();
    scenePlayer.seekTo(sceneStartFor(activeTrack), true);
    musicPlayers.forEach((p, i) => p.seekTo(CONFIG.tracks[i].start || 0, true));
    play();
    setScrim(0, CONFIG.cycle.refadeMs);
  }

  // Any interaction path lands in play() or pause(); both cancel a fade
  // in flight so manual control always wins over the kiosk loop.
  function cancelCycleFade() {
    if (cycleAdvanceTO) { clearTimeout(cycleAdvanceTO); cycleAdvanceTO = null; }
    if (cycleFading) {
      cycleFading = false;
      setScrim(0, 300);
    }
  }

  function startCycleWatch() {
    stopCycleWatch();
    cycleWatch = setInterval(() => {
      if (!isPlaying || cycleFading) return;
      if (Date.now() < cycleGraceUntil) return;
      let t = 0;
      try { t = scenePlayer.getCurrentTime(); } catch (e) { return; }
      if (t >= CONFIG.cycle.at) beginCycleFade();
    }, 500);
  }
  function stopCycleWatch() {
    if (cycleWatch) { clearInterval(cycleWatch); cycleWatch = null; }
  }

  // ─── TRANSPORT ───────────────────────────────────────────────────
  function play() {
    if (!allReady) return;
    cancelCycleFade();
    cycleGraceUntil = Date.now() + 2000;
    scenePlayer.playVideo();
    musicPlayers.forEach(p => p.playVideo());
    applyAudioGate(true);
    isPlaying = true;
    hideCover();
    updateTransportUI();
    startCycleWatch();
  }

  function pause() {
    cancelCycleFade();
    stopCycleWatch();
    if (scenePlayer) scenePlayer.pauseVideo();
    musicPlayers.forEach(p => { try { p.pauseVideo(); } catch (e) {} });
    isPlaying = false;
    showCover('PAUSED');
    updateTransportUI();
  }

  function togglePlay() {
    isPlaying ? pause() : play();
  }

  // Scene start point depends on the active source: a bed can carry its
  // own sceneStart offset (unused in this config, kept for parity).
  function sceneStartFor(idx) {
    if (idx >= 0 && CONFIG.tracks[idx].sceneStart != null) return CONFIG.tracks[idx].sceneStart;
    return CONFIG.scene.start || 0;
  }

  function restart() {
    if (!allReady) return;
    scenePlayer.seekTo(sceneStartFor(activeTrack), true);
    musicPlayers.forEach((p, i) => p.seekTo(CONFIG.tracks[i].start || 0, true));
    play();
  }

  // ─── MUSIC SWITCHING ─────────────────────────────────────────────
  // FROM TOP (default): selecting any bed resets scene and beds to
  // their start points and plays. SEAMLESS: hot-switch in place, video
  // keeps rolling; starts playback if stopped. Either way the incoming
  // bed fades in over fadeInMs.
  function selectTrack(idx) {
    if (!allReady) return;
    activeTrack = idx;
    setActiveTrackUI();
    if (restartOnSwitch) {
      scenePlayer.seekTo(sceneStartFor(idx), true);
      musicPlayers.forEach((p, i) => p.seekTo(CONFIG.tracks[i].start || 0, true));
      play();
    } else {
      applyAudioGate(false);
      if (!isPlaying) play();
    }
  }

  // ─── SWITCH MODE TOGGLE ──────────────────────────────────────────
  const $modeFromTop = document.getElementById('modeFromTop');
  const $modeSeamless = document.getElementById('modeSeamless');
  function setMode(fromTop) {
    restartOnSwitch = fromTop;
    $modeFromTop.classList.toggle('active', fromTop);
    $modeSeamless.classList.toggle('active', !fromTop);
  }
  $modeFromTop.addEventListener('click', () => setMode(true));
  $modeSeamless.addEventListener('click', () => setMode(false));

  // ─── UI ──────────────────────────────────────────────────────────
  function setActiveTrackUI() {
    $selector.querySelectorAll('.sel-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.idx, 10) === activeTrack);
    });
  }

  function updateTransportUI() {
    $playBtn.textContent = isPlaying ? 'PAUSE' : 'PLAY';
  }

  function onSceneStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
      killCaptions();
      if (!ccKilledOnce) { setTimeout(killCaptions, 800); ccKilledOnce = true; }
    }
    if (e.data === YT.PlayerState.ENDED) {
      // Upload ran out before (or during) the cycle fade: advance now.
      advanceCycle();
    }
  }

  // ─── VOLUME KNOB INTERACTION ─────────────────────────────────────
  let knobDragging = false, knobStartY = 0, knobStartVal = 100;
  $knob.addEventListener('pointerdown', (e) => {
    knobDragging = true;
    knobStartY = e.clientY;
    knobStartVal = masterVol;
    try { $knob.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  $knob.addEventListener('pointermove', (e) => {
    if (!knobDragging) return;
    const dy = knobStartY - e.clientY;   // drag up = louder
    masterVol = Math.max(0, Math.min(100, Math.round(knobStartVal + dy)));
    setKnobVisual();
    applyMasterVol();
  });
  function endKnobDrag(e) {
    knobDragging = false;
    if (e && e.pointerId != null) { try { $knob.releasePointerCapture(e.pointerId); } catch (_) {} }
  }
  $knob.addEventListener('pointerup', endKnobDrag);
  $knob.addEventListener('pointercancel', endKnobDrag);
  $knob.addEventListener('wheel', (e) => { e.preventDefault(); nudgeVol(e.deltaY < 0 ? 1 : -1); }, { passive: false });
  $knob.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { nudgeVol(2); e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { nudgeVol(-2); e.preventDefault(); }
  });

  // ─── TUNE PANEL (temporary testing scaffold) ─────────────────────
  // Edits CONFIG start times in place so FROM TOP / RESTART audition
  // the new alignment immediately. Accepts "2:35" or plain seconds.
  // Nudge buttons apply and restart at once for A/B by ear. COPY gives
  // the final values back in config form.
  function parseTime(v) {
    v = String(v).trim();
    if (v.includes(':')) {
      const parts = v.split(':');
      const m = parseInt(parts[0] || '0', 10) || 0;
      const s = parseFloat(parts[1] || '0') || 0;
      return m * 60 + s;
    }
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }
  function fmtTime(sec) {
    sec = Math.round(sec * 100) / 100;
    const m = Math.floor(sec / 60);
    let s = sec - m * 60;
    let str = (s < 10 ? '0' : '') + (Number.isInteger(s) ? String(s) : s.toFixed(2).replace(/0$/, ''));
    return m + ':' + str;
  }
  function tuneSources() {
    const list = [{ label: 'SCENE', get: () => CONFIG.scene.start || 0, set: v => { CONFIG.scene.start = v; } }];
    CONFIG.tracks.forEach((t, i) => {
      list.push({ label: t.label, get: () => t.start || 0, set: v => { t.start = v; } });
    });
    return list;
  }
  function tuneReadoutText() {
    const bits = ['scene ' + (CONFIG.scene.start || 0) + 's (' + fmtTime(CONFIG.scene.start || 0) + ')'];
    CONFIG.tracks.forEach((t, i) => {
      bits.push('E' + (i + 1) + ' ' + (t.start || 0) + 's (' + fmtTime(t.start || 0) + ')');
    });
    return bits.join(' | ');
  }
  function buildTunePanel() {
    const $panel = document.getElementById('tunePanel');
    const srcs = tuneSources();
    const inputs = [];

    srcs.forEach((src, i) => {
      const row = document.createElement('div');
      row.className = 'tune-row';

      const lab = document.createElement('div');
      lab.className = 'tune-row-label';
      lab.textContent = src.label;
      row.appendChild(lab);

      const inp = document.createElement('input');
      inp.className = 'tune-input';
      inp.value = fmtTime(src.get());
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyAll(); });
      inputs.push(inp);
      row.appendChild(inp);

      const rem = document.createElement('span');
      rem.className = 'tune-remaining';
      rem.textContent = '\u2014';
      row.dataset.srcIdx = String(i);
      row.appendChild(rem);

      [-1, -0.25, 0.25, 1].forEach(d => {
        const b = document.createElement('button');
        b.className = 'tune-nudge';
        b.textContent = (d > 0 ? '+' : '\u2212') + String(Math.abs(d)).replace('0.', '.');
        b.addEventListener('click', () => {
          const v = Math.max(0, parseTime(inp.value) + d);
          src.set(v);
          inp.value = fmtTime(v);
          refreshReadout();
          restart();
        });
        row.appendChild(b);
      });

      $panel.appendChild(row);
    });

    const actions = document.createElement('div');
    actions.className = 'tune-actions';

    const applyBtn = document.createElement('button');
    applyBtn.className = 'transport-btn';
    applyBtn.textContent = 'APPLY + RESTART';
    actions.appendChild(applyBtn);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'transport-btn';
    copyBtn.textContent = 'COPY TIMES';
    actions.appendChild(copyBtn);

    const readout = document.createElement('div');
    readout.className = 'tune-readout';
    actions.appendChild(readout);

    $panel.appendChild(actions);

    function refreshReadout() { readout.textContent = tuneReadoutText(); refreshRemaining(); }

    // Remaining = player duration - start point. Durations come from the
    // YT players once loaded; 0 means metadata not ready yet. The row
    // that cuts off first gets the accent highlight.
    function refreshRemaining() {
      const players = [scenePlayer].concat(musicPlayers);
      const rows = Array.from($panel.querySelectorAll('.tune-row'));
      let minIdx = -1, minVal = Infinity;
      rows.forEach((row, i) => {
        const span = row.querySelector('.tune-remaining');
        let dur = 0;
        try { dur = players[i] ? players[i].getDuration() : 0; } catch (e) {}
        if (!dur) { span.textContent = '\u2014'; return; }
        const remv = dur - srcs[i].get();
        span.textContent = fmtTime(Math.max(0, remv)) + ' left of ' + fmtTime(dur);
        if (remv < minVal) { minVal = remv; minIdx = i; }
      });
      rows.forEach((row, i) => row.classList.toggle('shortest', i === minIdx));
    }
    tuneRefreshRemaining = refreshRemaining;

    function applyAll() {
      srcs.forEach((src, i) => {
        const v = Math.max(0, parseTime(inputs[i].value));
        src.set(v);
        inputs[i].value = fmtTime(v);
      });
      refreshReadout();
      restart();
    }
    applyBtn.addEventListener('click', applyAll);

    copyBtn.addEventListener('click', () => {
      const text = tuneReadoutText();
      const done = () => {
        copyBtn.textContent = 'COPIED';
        setTimeout(() => { copyBtn.textContent = 'COPY TIMES'; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    });

    function fallbackCopy(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }

    refreshReadout();
  }

  document.getElementById('tuneToggle').addEventListener('click', () => {
    document.getElementById('tune').classList.toggle('open');
  });
  buildTunePanel();
  // Panel is display:none for students; ?tune=1 on the URL unhides it.
  if (new URLSearchParams(location.search).has('tune')) {
    document.getElementById('tune').style.display = 'block';
  }

  // ─── WIRE UP ─────────────────────────────────────────────────────
  $playBtn.addEventListener('click', togglePlay);
  $restartBtn.addEventListener('click', restart);
  // Shield is fully inert: video clicks do nothing. Pausing lives in the
  // transport only, so YouTube never sees a click and never shows chrome.
  $shield.addEventListener('click', (e) => e.preventDefault());
  setKnobVisual();
  buildDom();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
