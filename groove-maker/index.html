<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groove Maker</title>
<style>
/* Groove Maker — playable. Uniform matrix · instrument icons · swing model.
   No header, no top strip, no beat numbers, no drawn line. */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #1E1A17; --bgDeep: #14110F; --panel: #16120F;
  --text: #EAE0D0; --dim: rgba(234,224,208,.55); --faint: rgba(234,224,208,.22);
  --accent: #C07838; --border: rgba(234,224,208,.14); --borderB: rgba(234,224,208,.32);
  --mono: 'Courier New', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent;
  font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
.stage { display: flex; align-items: flex-start; justify-content: center;
  padding: 20px 24px; margin: 8px; background: var(--bg); border-radius: 12px; }
.gm { width: 880px; max-width: 100%; color: var(--text); }

/* ───────── grid (hero) ───────── */
.grid-wrap { position: relative; padding-top: 26px; }
.grid { position: relative; width: 100%; border: 1px solid var(--border); border-radius: 3px; background: var(--bgDeep);
  background-image: radial-gradient(circle at 50% -8%, rgba(192,120,56,.05), transparent 55%); }

.ir { position: absolute; left: 0; top: 0; bottom: 0; z-index: 5; display: flex; flex-direction: column;
  border-right: 1px solid var(--border); background: var(--panel); }
.ir-cell { display: flex; align-items: center; justify-content: center; }
.ic { width: 23px; height: 23px; display: block; }
.ic svg { width: 100%; height: 100%; display: block; }

.lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
.lines .s16 { stroke: var(--border); stroke-opacity: .3; }
.lines .s8  { stroke: var(--border); stroke-opacity: .5; }
.lines .s4  { stroke: var(--borderB); }
.lines .sep { stroke: var(--border); stroke-opacity: .5; }
.lines line { stroke-width: 1; }

.notes { position: absolute; inset: 0; z-index: 4; }
.home { position: absolute; width: 1px; height: 12px; transform: translate(-50%,-50%); background: var(--faint);
  z-index: 2; pointer-events: none; }
.dot { position: absolute; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%,-50%);
  z-index: 4; background: var(--c); color: var(--c); cursor: grab; touch-action: none; }
.dot:active { cursor: grabbing; }
.dot.sel { z-index: 6; box-shadow: 0 0 0 3px var(--bgDeep), 0 0 0 4px var(--text); }
.dot.firing { box-shadow: 0 0 0 2px var(--bgDeep), 0 0 0 3px currentColor; }           /* minimal */
.dot.firing.sel { box-shadow: 0 0 0 3px var(--bgDeep), 0 0 0 4px var(--text), 0 0 0 5px currentColor; }
@media (prefers-reduced-motion: no-preference) { .dot { transition: box-shadow .1s ease; } }

/* swing chip — single bare number, only on selected note */
.chip { position: absolute; z-index: 7; transform: translate(-50%,-100%); white-space: nowrap;
  font-family: var(--mono); font-size: 11px; color: var(--bg); background: var(--c);
  padding: 2px 7px; border-radius: 3px; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity .12s; }
.chip.show { opacity: 1; }
.chip::after { content: ""; position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%);
  border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid var(--c); }

/* ───────── deck ───────── */
.deck { display: flex; align-items: flex-end; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.cgrp { display: flex; flex-direction: column; gap: 6px; }
.clabel { font-size: 8.5px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; font-weight: 600; }

/* single play/stop toggle */
.toggle { width: 56px; height: 36px; display: flex; align-items: center; justify-content: center;
  background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 3px; cursor: pointer; }
.toggle svg { width: 13px; height: 13px; display: block; }
.toggle.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }

/* swing stepper */
.stepper { display: flex; align-items: center; height: 36px; border: 1px solid var(--border); border-radius: 3px; }
.stepper button { width: 34px; height: 100%; background: transparent; color: var(--text); border: none;
  cursor: pointer; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
.stepper button:first-child { border-right: 1px solid var(--border); }
.stepper button:last-child { border-left: 1px solid var(--border); }
.stepper button:disabled { color: var(--faint); cursor: default; }
.sval { min-width: 46px; text-align: center; font-family: var(--mono); font-size: 13px; }
.sval.empty { color: var(--dim); }

/* resolution segmented */
.seg { display: flex; }
.sbtn { min-width: 48px; height: 36px; padding: 0 12px; background: transparent; color: var(--text);
  border: 1px solid var(--border); border-right: none; cursor: pointer; font-family: var(--mono);
  font-size: 13px; display: flex; align-items: center; justify-content: center; }
.sbtn:first-child { border-radius: 3px 0 0 3px; }
.sbtn:last-child { border-right: 1px solid var(--border); border-radius: 0 3px 3px 0; }
.sbtn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

/* tempo numeric field */
.numfield { display: flex; align-items: center; height: 36px; border: 1px solid var(--border); border-radius: 3px;
  padding: 0 6px 0 11px; gap: 7px; }
.numfield input { width: 44px; background: transparent; border: none; color: var(--text); font-family: var(--mono);
  font-size: 14px; text-align: right; outline: none; -moz-appearance: textfield; }
.numfield input::-webkit-outer-spin-button, .numfield input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.numfield .suf { font-size: 8.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; }
.numfield .steppers { display: flex; flex-direction: column; margin-left: 2px; }
.numfield .steppers button { width: 18px; height: 17px; background: transparent; border: none; color: var(--dim);
  cursor: pointer; font-size: 8px; line-height: 1; padding: 0; }
.numfield .steppers button:hover { color: var(--text); }

.spacer { flex: 1; }
.actions { display: flex; gap: 8px; }
.btn { height: 36px; padding: 0 16px; display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  font-weight: 600; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn.ghost:hover { border-color: var(--borderB); }
.btn.solid { background: var(--accent); color: var(--bg); border: 1px solid var(--accent); }
.btn:active { transform: translateY(1px); }

/* volume slider — compact, between tempo and groove */
.vol-wrap { display: flex; align-items: center; height: 36px; gap: 6px;
  padding: 0 8px; border: 1px solid var(--border); border-radius: 3px; }
.vol-range { -webkit-appearance: none; appearance: none; width: 64px; height: 20px;
  background: transparent; cursor: pointer; margin: 0; padding: 0; }
.vol-range::-webkit-slider-runnable-track { height: 1px; background: var(--border); border: none; }
.vol-range::-moz-range-track { height: 1px; background: var(--border); border: none; }
.vol-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
  width: 8px; height: 16px; background: var(--accent); border: none; border-radius: 0;
  margin-top: -8px; cursor: grab; }
.vol-range::-moz-range-thumb { width: 8px; height: 16px; background: var(--accent); border: none; border-radius: 0; cursor: grab; }
.vol-readout { font-family: var(--mono); font-size: 11px; color: var(--text); min-width: 32px; text-align: right; }

</style>
</head>
<body>
<div class="stage">
  <div class="gm" data-screen-label="Groove Maker">

    <div class="grid-wrap">
      <div class="grid" id="grid">
        <div class="ir" id="rail"></div>
        <svg class="lines" id="lines" preserveAspectRatio="none"></svg>
        <div class="notes" id="notes"></div>
        <div class="chip" id="chip"></div>
      </div>
    </div>

    <div class="deck">
      <div class="cgrp">
        <div class="clabel">Play</div>
        <button class="toggle" id="toggle" title="Play"></button>
      </div>

      <div class="cgrp">
        <div class="clabel">Swing</div>
        <div class="stepper">
          <button id="sw-dec" title="Earlier">&minus;</button>
          <span class="sval" id="sw-val">50</span>
          <button id="sw-inc" title="Later">+</button>
        </div>
      </div>

      <div class="cgrp">
        <div class="clabel">Resolution</div>
        <div class="seg">
          <button class="sbtn" data-res="0.1">&times;.1</button>
          <button class="sbtn active" data-res="1">&times;1</button>
          <button class="sbtn" data-res="5">&times;5</button>
        </div>
      </div>

      <div class="cgrp">
        <div class="clabel">Tempo</div>
        <div class="numfield">
          <input id="bpm" type="number" value="85" inputmode="numeric" aria-label="Tempo (BPM)">
          <span class="suf">bpm</span>
          <div class="steppers">
            <button id="bpm-up" title="Faster">&#9650;</button>
            <button id="bpm-dn" title="Slower">&#9660;</button>
          </div>
        </div>
      </div>

      <div class="cgrp">
        <div class="clabel">Volume</div>
        <div class="vol-wrap">
          <input id="vol" class="vol-range" type="range" min="-36" max="0" step="0.5" value="-6" aria-label="Volume (dB)">
          <span class="vol-readout" id="vol-readout">&minus;6 dB</span>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="cgrp">
        <div class="clabel">Groove</div>
        <div class="actions">
          <button class="btn ghost" id="reset" title="Reset all swing to 50">Reset</button>
          <button class="btn solid" id="export" title="Download groove template">Export Template</button>
        </div>
      </div>
    </div>

  </div>
</div>

  grid.style.height = GRIDH + 'px';

  // rail
  document.getElementById('rail').style.width = RAILW + 'px';
  document.getElementById('rail').innerHTML = LANES.map((ln) =>
    `<div class="ir-cell" style="height:${ROWH}px"><span class="ic" style="color:${ln.color}">${ICON[ln.key]}</span></div>`
  ).join('');

  // dots
  let dh = '';
  for (let s = 0; s < 16; s++) {
    const c = LANES[STEP_LANE[s]].color;
    dh += `<span class="home" data-s="${s}"></span>`;
    dh += `<span class="dot" data-s="${s}" style="--c:${c};background:${c};color:${c}"></span>`;
  }
  notesEl.innerHTML = dh;
  notesEl.querySelectorAll('.home').forEach((h) => { (dots[h.dataset.s] = dots[h.dataset.s] || {}).home = h; });
  notesEl.querySelectorAll('.dot').forEach((d) => { dots[d.dataset.s].dot = d; });

  function layout() {
    W = grid.clientWidth;
    if (!W) return;                       // bail until the grid has a real width
    gw = W - RAILW; colW = gw / 16;
    let l = '';
    for (let s = 0; s <= 16; s++) {
      const x = RAILW + s * colW;
      const cls = s % 4 === 0 ? 's4' : (s % 2 === 0 ? 's8' : 's16');
      l += `<line x1="${x}" y1="0" x2="${x}" y2="${GRIDH}" class="${cls}"/>`;
    }
    for (let i = 1; i < 4; i++) { const y = i * ROWH; l += `<line x1="${RAILW}" y1="${y}" x2="${W}" y2="${y}" class="sep"/>`; }
    linesSvg.setAttribute('viewBox', `0 0 ${W} ${GRIDH}`); linesSvg.innerHTML = l;
    positionAll();
  }
  function positionAll() {
    for (let s = 0; s < 16; s++) {
      const y = laneY(STEP_LANE[s]);
      dots[s].dot.style.left = dotX(s) + 'px'; dots[s].dot.style.top = y + 'px';
      dots[s].home.style.left = stepX(s) + 'px'; dots[s].home.style.top = y + 'px';
    }
    updateChip();
  }

  // ── selection + chip ──
  function select(s) {
    if (selStep != null && dots[selStep]) dots[selStep].dot.classList.remove('sel');
    selStep = s;
    if (s != null) dots[s].dot.classList.add('sel');
    updateChip(); updateStepper();
  }
  function updateChip() {
    if (selStep == null) { chip.classList.remove('show'); return; }
    const s = selStep, c = LANES[STEP_LANE[s]].color;
    chip.style.setProperty('--c', c);
    chip.style.left = dotX(s) + 'px';
    chip.style.top = (laneY(STEP_LANE[s]) - 14) + 'px';
    chip.textContent = fmtSwing(swing[s]);
    chip.classList.add('show');
  }
  function setSwing(s, v) {
    swing[s] = Math.max(SW_MIN, Math.min(SW_MAX, round1(v)));
    dots[s].dot.style.left = dotX(s) + 'px';
    if (s === selStep) { updateChip(); updateStepper(); }
  }

  // ── drag + dblclick recentre ──
  let drag = null;
  notesEl.addEventListener('pointerdown', (e) => {
    const d = e.target.closest('.dot'); if (!d) return;
    const s = +d.dataset.s; select(s);
    drag = { s, rect: grid.getBoundingClientRect(), moved: false };
    d.setPointerCapture(e.pointerId); e.preventDefault();
  });
  notesEl.addEventListener('pointermove', (e) => {
    if (!drag) return; drag.moved = true;
    const px = e.clientX - drag.rect.left;
    const off = (px - stepX(drag.s)) / (4 * colW);     // beats
    setSwing(drag.s, SW_MID + off / OFF_LIMIT * (SW_MAX - SW_MID));
  });
  const endDrag = () => { drag = null; };
  notesEl.addEventListener('pointerup', endDrag);
  notesEl.addEventListener('pointercancel', endDrag);
  notesEl.addEventListener('dblclick', (e) => {
    const d = e.target.closest('.dot'); if (!d) return;
    setSwing(+d.dataset.s, SW_MID);                     // recentre
  });

  // click empty grid → deselect
  grid.addEventListener('pointerdown', (e) => { if (e.target === grid || e.target === linesSvg) select(null); });
  window.addEventListener('keydown', (e) => {
    if (selStep == null) return;
    if (e.key === 'ArrowRight') { setSwing(selStep, swing[selStep] + res); e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { setSwing(selStep, swing[selStep] - res); e.preventDefault(); }
  });

  // ── WebAudio drums (real samples) ──
  let ac = null, master = null;
  const buffers = {};
  let audioReady = null;
  const SAMPLES = { kick: KICK_B64, snare: SNARE_B64, hat: HAT_B64, cowbell: COWBELL_B64 };
  function audio() {
    if (audioReady) return audioReady;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = dbToGain(volumeDb); master.connect(ac.destination);
    audioReady = Promise.all(Object.entries(SAMPLES).map(async ([k, b64]) => {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      buffers[k] = await ac.decodeAudioData(bytes.buffer);
    })).then(() => ac);
    return audioReady;
  }
  function hit(li, t) {
    const key = LANES[li].key;
    const buf = buffers[key]; if (!buf) return;
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.connect(master);
    src.start(t);
  }

  // ── scheduler ──
  let nextStep = 0, nextTime = 0, timer = null;
  const fireQ = [];
  const sec16 = () => 60 / bpm / 4;
  function scheduler() {
    while (nextTime < ac.currentTime + 0.10) {
      const s = nextStep;
      const t = nextTime + swingToOff(swing[s]) * (60 / bpm);
      hit(STEP_LANE[s], t); fireQ.push({ s, time: t });
      nextTime += sec16(); nextStep = (nextStep + 1) % 16;
    }
  }
  function illuminate() {
    if (!playing) return;
    const now = ac.currentTime;
    while (fireQ.length && fireQ[0].time <= now) {
      const d = dots[fireQ.shift().s].dot;
      d.classList.add('firing'); setTimeout(() => d.classList.remove('firing'), 105);
    }
    requestAnimationFrame(illuminate);
  }
  async function play() {
    await audio(); if (ac.state === 'suspended') await ac.resume();
    playing = true; nextStep = 0; nextTime = ac.currentTime + 0.06; fireQ.length = 0;
    timer = setInterval(scheduler, 25); requestAnimationFrame(illuminate);
    toggleBtn.classList.add('on'); toggleBtn.innerHTML = STOP_SVG; toggleBtn.title = 'Stop';
  }
  function stop() {
    playing = false; clearInterval(timer); timer = null; fireQ.length = 0;
    document.querySelectorAll('.dot.firing').forEach((d) => d.classList.remove('firing'));
    toggleBtn.classList.remove('on'); toggleBtn.innerHTML = PLAY_SVG; toggleBtn.title = 'Play';
  }

  // ── deck controls ──
  const toggleBtn = document.getElementById('toggle');
  toggleBtn.innerHTML = PLAY_SVG;
  toggleBtn.addEventListener('click', () => (playing ? stop() : play()));

  document.getElementById('reset').addEventListener('click', () => { for (let s = 0; s < 16; s++) setSwing(s, SW_MID); });

  const swDec = document.getElementById('sw-dec'), swInc = document.getElementById('sw-inc'), swVal = document.getElementById('sw-val');
  swDec.addEventListener('click', () => selStep != null && setSwing(selStep, swing[selStep] - res));
  swInc.addEventListener('click', () => selStep != null && setSwing(selStep, swing[selStep] + res));
  function updateStepper() {
    const has = selStep != null;
    swDec.disabled = swInc.disabled = !has;
    swVal.textContent = has ? fmtSwing(swing[selStep]) : '\u2013\u2013';
    swVal.classList.toggle('empty', !has);
  }

  document.querySelectorAll('.sbtn[data-res]').forEach((b) => b.addEventListener('click', () => {
    res = parseFloat(b.dataset.res);
    document.querySelectorAll('.sbtn[data-res]').forEach((x) => x.classList.toggle('active', x === b));
  }));

  const bpmInput = document.getElementById('bpm');
  function setBpm(v) { bpm = Math.max(40, Math.min(220, Math.round(v) || 40)); bpmInput.value = bpm; updateChip(); }
  bpmInput.addEventListener('change', () => setBpm(+bpmInput.value));
  bpmInput.addEventListener('blur', () => setBpm(+bpmInput.value));
  document.getElementById('bpm-up').addEventListener('click', () => setBpm(bpm + 1));
  document.getElementById('bpm-dn').addEventListener('click', () => setBpm(bpm - 1));

  // volume: -36 to 0 dB, init -6
  const volInput = document.getElementById('vol');
  const volReadout = document.getElementById('vol-readout');
  let volumeDb = -6;
  function dbToGain(db) {
    if (db <= -36 + 0.01) return 0;
    return Math.pow(10, db / 20);
  }
  function setVol(db) {
    volumeDb = Math.max(-36, Math.min(0, db));
    if (master) master.gain.value = dbToGain(volumeDb);
    const label = volumeDb <= -36 + 0.01 ? '\u2212\u221e dB'
      : (volumeDb >= 0 ? '0 dB'
        : ((Math.round(volumeDb * 10) / 10) + ' dB').replace('-', '\u2212'));
    volReadout.textContent = label;
    volInput.value = volumeDb;
  }
  volInput.addEventListener('input', () => setVol(parseFloat(volInput.value)));

  // ── Ableton .agr export ──
  async function gzipStr(str) {
    const blob = new Blob([str], { type: 'text/plain' });
    const stream = blob.stream().pipeThrough(new CompressionStream('gzip'));
    const ab = await new Response(stream).arrayBuffer();
    return new Uint8Array(ab);
  }
  function buildAgr() {
    const parser = new DOMParser();
    const doc = parser.parseFromString(TEMPLATE_XML, 'application/xml');
    const events = doc.querySelectorAll('KeyTrack > Notes > MidiNoteEvent');
    if (events.length !== 16) throw new Error(`Template has ${events.length} notes, expected 16`);
    events.forEach((ne, i) => {
      let time = i * 0.25 + swingToOff(swing[i]);
      if (time < 0) time += 4;                  // wrap step-0 early offsets to end of bar
      ne.setAttribute('Time', time.toFixed(6));
    });
    doc.querySelectorAll('Groove > Name, MidiClip > Name').forEach((n) => n.setAttribute('Value', 'MOTE Groove'));
    let s = new XMLSerializer().serializeToString(doc);
    if (!s.startsWith('<?xml')) s = '<?xml version="1.0" encoding="UTF-8"?>\n' + s;
    return s;
  }
  document.getElementById('export').addEventListener('click', async () => {
    try {
      const xml = buildAgr();
      const gz = await gzipStr(xml);
      let bin = '';
      for (let i = 0; i < gz.length; i++) bin += String.fromCharCode(gz[i]);
      const b64 = btoa(bin);
      const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 16);
      const a = document.createElement('a');
      a.href = 'data:application/octet-stream;base64,' + b64;
      a.download = `MOTE_Groove_${ts}.agr`;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => document.body.removeChild(a), 100);
    } catch (err) {
      console.error('Export failed:', err);
    }
  });

  // ── init ──
  setBpm(85); select(selStep); updateStepper();
  layout();
  if (window.ResizeObserver) new ResizeObserver(layout).observe(grid);
  window.addEventListener('resize', layout);
  requestAnimationFrame(layout);          // first paint once width resolves
})();

</script>
</body>
</html>
