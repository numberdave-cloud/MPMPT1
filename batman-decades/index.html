<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batman Across the Decades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1E1A17;
    --text: #EAE0D0;
    --text-dim: rgba(234, 224, 208, 0.55);
    --text-faint: rgba(234, 224, 208, 0.3);
    --accent: #C07838;
    --accent-glow: #D8904A;
    --border: rgba(234, 224, 208, 0.15);
    --border-bright: rgba(234, 224, 208, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body { padding: 12px; }

  .rack {
    max-width: 900px;
    margin: 0 auto;
    background: var(--bg);
    border: 1px solid rgba(0, 0, 0, 0.6);
    border-radius: 24px;
    padding: 22px 24px 20px;
    position: relative;
  }
  .rack::before {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid var(--border);
    border-radius: 19px;
    pointer-events: none;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .title {
    font-size: 13px;
    letter-spacing: 0.2em;
    font-weight: 600;
    text-transform: uppercase;
  }
  .subtitle {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  .grid {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .bat-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 140px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .bat-img-wrap {
    width: 140px;
    height: 140px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s, opacity 0.2s;
  }
  .bat-img-wrap img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .bat-cell:hover .bat-img-wrap {
    border-color: var(--border-bright);
  }

  .bat-cell.active .bat-img-wrap {
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(216, 144, 74, 0.45);
  }

  .grid.has-active .bat-cell:not(.active) .bat-img-wrap {
    opacity: 0.45;
  }

  .bat-indicator {
    height: 18px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bat-indicator img {
    height: 12px;
    width: auto;
    display: none;
  }
  .bat-cell.loading .bat-indicator img {
    display: block;
    animation: batpulse 1s ease-in-out infinite;
  }
  .bat-cell.playing .bat-indicator img {
    display: block;
    filter: drop-shadow(0 0 4px rgba(255, 204, 0, 0.7));
  }
  @keyframes batpulse {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }

  /* info panel */
  .info-panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 16px;
    padding: 14px 18px;
    min-height: 130px;
  }

  .info-placeholder {
    font-size: 12px;
    color: var(--text-faint);
    font-style: italic;
    letter-spacing: 0.02em;
    text-align: center;
    padding: 44px 0;
  }

  .info-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .info-title {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .info-year {
    font-family: 'Courier New', monospace;
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 0.1em;
  }

  .info-composer {
    font-size: 12px;
    letter-spacing: 0.18em;
    font-weight: 600;
    text-transform: uppercase;
  }

  .info-link {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.05em;
    text-decoration: none;
    border-bottom: 1px solid rgba(192, 120, 56, 0.4);
    transition: color 0.1s, border-color 0.1s;
  }
  .info-link:hover {
    color: var(--accent-glow);
    border-color: var(--accent-glow);
  }

  .info-bullets {
    list-style: none;
  }
  .info-bullets li {
    font-size: 12.5px;
    line-height: 1.55;
    padding: 3px 0 3px 14px;
    position: relative;
  }
  .info-bullets li::before {
    content: "\00B7";
    position: absolute;
    left: 2px;
    color: var(--accent);
    font-weight: 600;
  }

  /* hidden YouTube players */
  #players {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }

  @media (max-width: 820px) {
    .grid { gap: 10px; }
    .bat-cell, .bat-img-wrap { width: 118px; }
    .bat-img-wrap { height: 118px; }
  }
</style>
</head>
<body>

  // STATE
  let players = [];
  let ready = [];
  let activeIdx = null;
  let fadeTimer = null;
  let apiLoaded = false;

  // UI
  const $grid = document.getElementById('grid');
  const $infoPanel = document.getElementById('infoPanel');

  function buildCells() {
    BATMEN.forEach((b, i) => {
      const cell = document.createElement('div');
      cell.className = 'bat-cell';
      cell.id = 'cell-' + i;
      cell.innerHTML =
        '<div class="bat-img-wrap"><img src="' + b.img + '" alt="Batman ' + b.year + '"></div>' +
        '<div class="bat-indicator"><img src="' + BAT_PNG + '" alt=""></div>';
      cell.addEventListener('click', () => handlePress(i));
      $grid.appendChild(cell);
    });
  }

  function renderPanel(idx) {
    const b = BATMEN[idx];
    const url = 'https://www.youtube.com/watch?v=' + b.videoId;
    $infoPanel.innerHTML =
      '<div class="info-header">' +
        '<div class="info-title">' +
          '<span class="info-year">' + b.year + '</span>' +
          '<span class="info-composer">' + b.composer + '</span>' +
        '</div>' +
        '<a class="info-link" href="' + url + '" target="_blank" rel="noopener">Full piece on YouTube</a>' +
      '</div>' +
      '<ul class="info-bullets">' +
        b.bullets.map(t => '<li>' + t + '</li>').join('') +
      '</ul>';
  }

  function setCellState(idx, state) {
    document.querySelectorAll('.bat-cell').forEach((c, i) => {
      c.classList.toggle('loading', i === idx && state === 'loading');
      c.classList.toggle('playing', i === idx && state === 'playing');
      c.classList.toggle('active',  i === idx && state !== null);
    });
    $grid.classList.toggle('has-active', state !== null);
  }

  // YOUTUBE
  function loadApi() {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = () => { /* API unreachable; presses will no-op gracefully */ };
    document.head.appendChild(tag);
  }

  window.onYouTubeIframeAPIReady = function() {
    apiLoaded = true;
    const $players = document.getElementById('players');
    BATMEN.forEach((b, i) => {
      const holder = document.createElement('div');
      holder.id = 'yt-' + i;
      $players.appendChild(holder);
      players[i] = new YT.Player('yt-' + i, {
        width: 200, height: 200,
        videoId: b.videoId,
        playerVars: { start: b.start, controls: 0, disablekb: 1, playsinline: 1 },
        events: {
          onReady: () => { ready[i] = true; players[i].cueVideoById({ videoId: b.videoId, startSeconds: b.start }); },
          onStateChange: (e) => handleStateChange(i, e.data)
        }
      });
    });
  };

  function handleStateChange(idx, ytState) {
    if (idx !== activeIdx) return;
    if (ytState === YT.PlayerState.PLAYING) {
      setCellState(idx, 'playing');
    } else if (ytState === YT.PlayerState.BUFFERING) {
      setCellState(idx, 'loading');
    } else if (ytState === YT.PlayerState.ENDED) {
      stopActive();
    }
  }

  // PLAYBACK
  function beginFade(idx) {
    clearInterval(fadeTimer);
    const target = BATMEN[idx].maxVol;
    let step = 0;
    players[idx].setVolume(0);
    fadeTimer = setInterval(() => {
      step++;
      const v = Math.min(target, Math.round((step / FADE_STEPS) * target));
      if (players[idx] && idx === activeIdx) players[idx].setVolume(v);
      if (step >= FADE_STEPS) clearInterval(fadeTimer);
    }, FADE_MS / FADE_STEPS);
  }

  function stopActive() {
    clearInterval(fadeTimer);
    if (activeIdx !== null && players[activeIdx] && ready[activeIdx]) {
      const b = BATMEN[activeIdx];
      players[activeIdx].stopVideo();
      players[activeIdx].cueVideoById({ videoId: b.videoId, startSeconds: b.start });
    }
    activeIdx = null;
    setCellState(null, null);
  }

  function handlePress(idx) {
    renderPanel(idx);

    if (!apiLoaded || !ready[idx]) return;

    if (idx === activeIdx) {
      stopActive();
      return;
    }

    if (activeIdx !== null) stopActive();

    activeIdx = idx;
    setCellState(idx, 'loading');
    const b = BATMEN[idx];
    players[idx].setVolume(0);
    players[idx].seekTo(b.start, true);
    players[idx].playVideo();
    beginFade(idx);
  }

  // INIT
  buildCells();
  loadApi();
</script>
