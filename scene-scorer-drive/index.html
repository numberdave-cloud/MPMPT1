<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Scene Scorer — Drive [Temp Track]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1E1A17;
    --text: #EAE0D0;
    --text-dim: rgba(234, 224, 208, 0.55);
    --text-faint: rgba(234, 224, 208, 0.3);
    --accent: #C07838;
    --accent-glow: #D8904A;
    --border: rgba(234, 224, 208, 0.15);
    --border-bright: rgba(234, 224, 208, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Cross-origin iframes don't reliably composite a transparent page
     background in Canvas, so paint the surround white to match the
     Canvas page rather than relying on transparency. */
  html, body {
    background: #FFFFFF;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding: 4px;
    max-width: 740px;
    margin: 0 auto;
  }

  /* Rack-hardware card: 24px radius, outer dark frame, inner 1px light
     stroke inset from the edge. The whole MOTE lives inside it. */
  .rack {
    position: relative;
    background: var(--bg);
    border: 2px solid #0B0907;
    border-radius: 24px;
    padding: 20px 24px 28px;
  }
  .rack::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(234, 224, 208, 0.3);
    border-radius: 18px;
    pointer-events: none;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-wrap: wrap;
  }

  .title {
    font-size: 13px;
    letter-spacing: 0.2em;
    font-weight: 600;
  }

  /* Letterbox crop. The film is ~2.35:1 inside a 16:9 player, so the
     baked black bars top and bottom are where YouTube paints its title,
     share/watch-later icons, and logo. The frame is cut to the picture
     and the 16:9 player is oversized and centred behind it, so those
     strips are clipped off. Adjust --frame-aspect to tune the crop. */
  .video-wrap {
    --frame-aspect: 2.6;
    position: relative;
    width: 100%;
    aspect-ratio: var(--frame-aspect) / 1;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  /* Asymmetric crop maths (all fractions of player width):
     16:9 player height 0.5625, ~2.35:1 picture height 0.4255,
     baked bars 0.0685 each. Frame at 2.6:1 = 0.3846 high. The whole
     extra crop is taken from the TOP (bar + ~0.041 of picture) to bury
     YouTube's title/channel text, which hangs below the top bar. The
     bottom crop stays exactly one bar (0.0685) so the logo stays hidden
     with no black sliver. top = -(0.5625-0.3846-0.0685)/0.3846 = -28.4%. */
  .video-wrap > div#scenePlayer,
  .video-wrap iframe {
    position: absolute;
    left: 0;
    top: -28.4%;
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    border: none;
  }

  /* Transparent shield: intercepts every mouse event so YouTube never
     receives them. No click-through at all: pausing is the transport
     button's job. Also stops hover from waking YouTube's chrome. */
  .click-shield {
    position: absolute;
    inset: 0;
    z-index: 2;
    cursor: default;
    background: transparent;
  }

  /* Opaque cover shown whenever the scene is not rolling. Hides the
     thumbnail/title chrome before start and the paused-state overlay
     (title, channel, More Videos) while paused or ended. */
  .video-cover {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    letter-spacing: 0.24em;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 500;
    transition: opacity 0.25s;
  }
  .video-cover.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Transport demoted: small quiet row under the selector. */
  .transport {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }

  .transport-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 0.14em;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: 500;
    transition: border-color 0.08s;
  }
  .transport-btn:hover:not(:disabled) { border-color: var(--border-bright); }
  .transport-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Lockout feedback on the pause button only. */
  @keyframes flashRed {
    50% { background: #C04838; border-color: #C04838; color: var(--bg); }
  }
  .transport-btn.flash-red { animation: flashRed 0.3s ease; }
  @keyframes flashGreen {
    50% { background: #7BA968; border-color: #7BA968; color: var(--bg); }
  }
  .transport-btn.flash-green { animation: flashGreen 0.45s ease 3; }

  /* ─── VOLUME KNOB ─── */
  .vol-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 6px;
  }
  .knob {
    width: 40px;
    height: 40px;
    border: 1px solid var(--border-bright);
    border-radius: 50%;
    position: relative;
    cursor: ns-resize;
    background: transparent;
    flex: none;
    touch-action: none;
    outline: none;
  }
  .knob:hover { border-color: var(--accent); }
  .knob:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(192,120,56,0.35); }
  .knob-indicator {
    position: absolute;
    left: calc(50% - 1px);
    top: 5px;
    width: 2px;
    height: 15px;
    background: var(--accent);
    border-radius: 1px;
    transform-origin: 50% 15px;
    transform: rotate(135deg);
  }
  .knob-label {
    font-size: 9px;
    letter-spacing: 0.16em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* Segment-style volume readout: mono digits in accent with soft glow,
     ghost segments behind at very low opacity. */
  .vol-readout {
    position: relative;
    font-family: 'Courier New', 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    min-width: 3ch;
    text-align: right;
  }
  .vol-readout .live {
    position: relative;
    z-index: 1;
    color: var(--accent);
    text-shadow: 0 0 7px rgba(216, 144, 74, 0.55);
  }
  .vol-readout .ghost {
    position: absolute;
    right: 0;
    top: 0;
    color: var(--text);
    opacity: 0.06;
  }

  .selector-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .selector-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* Selector is now the feature: big primary buttons. */
  .selector {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }

  .sel-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-bright);
    border-radius: 6px;
    padding: 16px 26px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.14em;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: 600;
    flex: 1 1 auto;
    transition: background 0.08s, border-color 0.08s, transform 0.05s;
  }
  .sel-btn:hover:not(:disabled) { border-color: var(--accent); }
  .sel-btn:active:not(:disabled) { transform: translateY(1px); }
  .sel-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .sel-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  /* ─── SWITCH MODE TOGGLE ─── */
  .mode-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mode-toggle-label {
    font-size: 9px;
    letter-spacing: 0.16em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .mode-group {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .mode-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 7px 12px;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 0.12em;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: 500;
    transition: background 0.08s, color 0.08s;
  }
  .mode-btn.active {
    background: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }

  /* Off-screen audio-only music players. Kept in-viewport with near-zero
     opacity rather than display:none so the browser doesn't throttle playback. */
  .hidden-players {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 200px;
    height: 120px;
    opacity: 0.01;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
  }
  .hidden-players div { width: 200px; height: 120px; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    .transport-btn { padding: 11px 16px; }
  }
</style>
</head>
<body>
  <div class="rack">
  <div class="header">
    <div class="title">SCENE SCORER</div>
  </div>

  <div class="video-wrap">
    <div id="scenePlayer"></div>
    <div class="click-shield" id="clickShield"></div>
    <div class="video-cover" id="videoCover"><span id="coverLabel">LOADING</span></div>
  </div>

  <div class="selector-row">
    <div class="selector-label">Music Bed</div>
    <div class="mode-toggle">
      <div class="mode-toggle-label">Switching</div>
      <div class="mode-group" role="group" aria-label="Switch mode">
        <button class="mode-btn active" id="modeFromTop">From Top</button>
        <button class="mode-btn" id="modeSeamless">Seamless</button>
      </div>
    </div>
  </div>
  <div class="selector" id="selector"></div>

  <div class="transport">
    <button class="transport-btn" id="playBtn" disabled>LOADING</button>
    <button class="transport-btn" id="restartBtn" disabled>RESTART</button>
    <div class="vol-control">
      <div class="knob" id="volKnob" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" tabindex="0">
        <div class="knob-indicator" id="volIndicator"></div>
      </div>
      <div class="knob-label">Vol</div>
      <div class="vol-readout" aria-hidden="true"><span class="ghost">888</span><span class="live" id="volReadout">100</span></div>
    </div>
  </div>

  <div class="hidden-players" id="hiddenPlayers" aria-hidden="true"></div>
  </div><!-- /rack -->

<script>
  // ─── CONFIG ──────────────────────────────────────────────────────
  // This is the only block you edit per scene.
  //
  // TEMP-TRACK VARIANT. The scene upload carries its own music (the temp
  // track everyone is in love with). Index -1 is the TEMP TRACK button:
  // scene audio unmuted, all beds muted. Selecting any bed mutes the
  // scene audio entirely and unmutes that bed.
  //
  //   scene.volume   — scene/temp-track level, 0..100
  //   tempLabel      — button text for the scene's own audio
  //   tracks[].id    — YouTube video id for each music bed
  //   tracks[].volume— per-bed level, 0..100  (trim by ear against the temp track)
  //   tracks[].label — button text students see
  //   tracks[].start — seconds into the bed to begin
  //   tracks[].sceneStart — optional: seconds into the SCENE when this bed
  //                     is chosen from the top (defaults to scene.start)
  //   startWith      — -1 for the temp track, or 0..n for a bed
  // The Vol knob on screen is a MASTER control that scales everything
  // together, so the balance you set above is preserved.
  const CONFIG = {
    scene:  { id: 'BHVbbcHWX4k', volume: 100, start: 0 },
    tempLabel: 'TEMP TRACK',
    tracks: [
      { label: 'MUSIC 1', id: 'DqiVp0Nx5I4', volume: 100, start: 6 },
      { label: 'MUSIC 2', id: 'EsvfptdFXf4', volume: 100, start: 0 },
      { label: 'MUSIC 3', id: 'dQw4w9WgXcQ', volume: 100, start: 0, sceneStart: 1 }
    ],
    startWith: -1
  };

  // ─── STATE ───────────────────────────────────────────────────────
  let scenePlayer = null;
  const musicPlayers = [];
  let readyCount = 0;
  const totalPlayers = 1 + CONFIG.tracks.length;
  let allReady = false;
  let isPlaying = false;
  let activeTrack = CONFIG.startWith;   // -1 = temp track (scene audio)
  let masterVol = 100;
  let ccKilledOnce = false;
  let restartOnSwitch = true;           // FROM TOP mode by default

  // ─── MUSIC 3 FIRST-TRIGGER LOCKOUT ───────────────────────────────
  // The first time MUSIC 3 is selected, every control locks for 15s.
  // No visual change: the interface simply stops answering. The one
  // tell is the pause button flashing red when pressed. On release the
  // pause button flashes green three times.
  const LOCK_TRACK = 2;        // index of MUSIC 3
  const LOCK_SECONDS = 15;
  let lockUsed = false;
  let locked = false;

  // ─── DOM REFS ────────────────────────────────────────────────────
  const $playBtn = document.getElementById('playBtn');
  const $restartBtn = document.getElementById('restartBtn');
  const $selector = document.getElementById('selector');
  const $hidden = document.getElementById('hiddenPlayers');
  const $shield = document.getElementById('clickShield');
  const $knob = document.getElementById('volKnob');
  const $indicator = document.getElementById('volIndicator');
  const $cover = document.getElementById('videoCover');
  const $coverLabel = document.getElementById('coverLabel');

  // ─── VIDEO COVER ─────────────────────────────────────────────────
  function showCover(label) {
    $coverLabel.textContent = label;
    $cover.classList.remove('hidden');
  }
  function hideCover() {
    $cover.classList.add('hidden');
  }

  // ─── LOCKOUT MACHINERY ───────────────────────────────────────────
  function flashPause(cls) {
    $playBtn.classList.remove('flash-red', 'flash-green');
    void $playBtn.offsetWidth;   // restart the animation
    $playBtn.classList.add(cls);
  }
  $playBtn.addEventListener('animationend', () => {
    $playBtn.classList.remove('flash-red', 'flash-green');
  });
  function engageLock() {
    lockUsed = true;
    locked = true;
    setTimeout(() => {
      locked = false;
      flashPause('flash-green');
    }, LOCK_SECONDS * 1000);
  }

  // ─── VOLUME HELPERS ──────────────────────────────────────────────
  function effVol(base) {
    return Math.max(0, Math.min(100, Math.round(base * masterVol / 100)));
  }
  function applyMasterVol() {
    if (scenePlayer && activeTrack === -1) {
      try { scenePlayer.setVolume(effVol(CONFIG.scene.volume)); } catch (e) {}
    }
    if (activeTrack >= 0 && musicPlayers[activeTrack]) {
      try { musicPlayers[activeTrack].setVolume(effVol(CONFIG.tracks[activeTrack].volume)); } catch (e) {}
    }
  }
  function setKnobVisual() {
    const angle = -135 + (masterVol / 100) * 270;
    $indicator.style.transform = 'rotate(' + angle + 'deg)';
    $knob.setAttribute('aria-valuenow', String(masterVol));
    document.getElementById('volReadout').textContent = String(masterVol);
  }
  function nudgeVol(delta) {
    masterVol = Math.max(0, Math.min(100, masterVol + delta));
    setKnobVisual();
    applyMasterVol();
  }

  // ─── AUDIO GATING ────────────────────────────────────────────────
  // One place decides who is audible: temp track (-1) or one bed.
  function applyAudioGate() {
    if (!scenePlayer) return;
    if (activeTrack === -1) {
      try { scenePlayer.setVolume(effVol(CONFIG.scene.volume)); scenePlayer.unMute(); } catch (e) {}
    } else {
      try { scenePlayer.mute(); } catch (e) {}
    }
    musicPlayers.forEach((p, i) => {
      try {
        if (i === activeTrack) { p.setVolume(effVol(CONFIG.tracks[i].volume)); p.unMute(); }
        else { p.mute(); }
      } catch (e) {}
    });
  }

  // ─── BUILD DOM FROM CONFIG ───────────────────────────────────────
  function buildDom() {
    CONFIG.tracks.forEach((t, i) => {
      const d = document.createElement('div');
      d.id = 'musicPlayer' + i;
      $hidden.appendChild(d);
    });

    const tempBtn = document.createElement('button');
    tempBtn.className = 'sel-btn';
    tempBtn.textContent = CONFIG.tempLabel;
    tempBtn.dataset.idx = '-1';
    tempBtn.disabled = true;
    $selector.appendChild(tempBtn);

    CONFIG.tracks.forEach((t, i) => {
      const b = document.createElement('button');
      b.className = 'sel-btn';
      b.textContent = t.label;
      b.dataset.idx = String(i);
      b.disabled = true;
      $selector.appendChild(b);
    });

    $selector.addEventListener('click', (e) => {
      const btn = e.target.closest('.sel-btn');
      if (!btn) return;
      selectTrack(parseInt(btn.dataset.idx, 10));
    });
  }

  // ─── YT PLAYERS ──────────────────────────────────────────────────
  function onYouTubeIframeAPIReady() {
    const vars = { controls: 0, disablekb: 1, modestbranding: 1, rel: 0, playsinline: 1, fs: 0, iv_load_policy: 3, cc_load_policy: 0 };

    scenePlayer = new YT.Player('scenePlayer', {
      videoId: CONFIG.scene.id,
      playerVars: vars,
      events: { onReady: onSceneReady, onStateChange: onSceneStateChange }
    });

    CONFIG.tracks.forEach((t, i) => {
      musicPlayers[i] = new YT.Player('musicPlayer' + i, {
        videoId: t.id,
        playerVars: vars,
        events: { onReady: () => onMusicReady(i) }
      });
    });
  }

  function onSceneReady() {
    try { scenePlayer.setVolume(effVol(CONFIG.scene.volume)); } catch (e) {}
    if (CONFIG.scene.start) { try { scenePlayer.seekTo(CONFIG.scene.start, true); } catch (e) {} }
    markReady();
  }

  function onMusicReady(i) {
    const p = musicPlayers[i], t = CONFIG.tracks[i];
    try { p.setVolume(effVol(t.volume)); p.mute(); } catch (e) {}
    if (t.start) { try { p.seekTo(t.start, true); } catch (e) {} }
    markReady();
  }

  function markReady() {
    readyCount++;
    if (readyCount >= totalPlayers && !allReady) {
      allReady = true;
      $playBtn.textContent = 'PLAY';
      $playBtn.disabled = false;
      $restartBtn.disabled = false;
      $selector.querySelectorAll('.sel-btn').forEach(b => { b.disabled = false; });
      showCover('READY');
      setActiveTrackUI();
    }
  }

  // ─── CAPTIONS ────────────────────────────────────────────────────
  function killCaptions() {
    try { scenePlayer.unloadModule('captions'); } catch (e) {}
    try { scenePlayer.unloadModule('cc'); } catch (e) {}
  }

  // ─── TRANSPORT ───────────────────────────────────────────────────
  function play() {
    if (!allReady) return;
    scenePlayer.playVideo();
    musicPlayers.forEach(p => p.playVideo());
    applyAudioGate();
    isPlaying = true;
    hideCover();
    updateTransportUI();
  }

  function pause() {
    if (scenePlayer) scenePlayer.pauseVideo();
    musicPlayers.forEach(p => { try { p.pauseVideo(); } catch (e) {} });
    isPlaying = false;
    showCover('PAUSED');
    updateTransportUI();
  }

  function togglePlay() {
    if (locked) { flashPause('flash-red'); return; }
    isPlaying ? pause() : play();
  }

  // Scene start point depends on the active source: a bed can carry its
  // own sceneStart offset (e.g. MUSIC 3 starts the scene 1s in).
  function sceneStartFor(idx) {
    if (idx >= 0 && CONFIG.tracks[idx].sceneStart != null) return CONFIG.tracks[idx].sceneStart;
    return CONFIG.scene.start || 0;
  }

  function restart() {
    if (!allReady || locked) return;
    scenePlayer.seekTo(sceneStartFor(activeTrack), true);
    musicPlayers.forEach((p, i) => p.seekTo(CONFIG.tracks[i].start || 0, true));
    play();
  }

  // ─── MUSIC SWITCHING ─────────────────────────────────────────────
  // FROM TOP (default): selecting any source resets scene and beds to
  // their start points and plays. SEAMLESS: hot-switch in place, video
  // keeps rolling; starts playback if stopped.
  function selectTrack(idx) {
    if (!allReady || locked) return;
    activeTrack = idx;
    setActiveTrackUI();
    if (restartOnSwitch) {
      scenePlayer.seekTo(sceneStartFor(idx), true);
      musicPlayers.forEach((p, i) => p.seekTo(CONFIG.tracks[i].start || 0, true));
      play();
    } else {
      applyAudioGate();
      if (!isPlaying) play();
    }
    if (idx === LOCK_TRACK && !lockUsed) engageLock();
  }

  // ─── SWITCH MODE TOGGLE ──────────────────────────────────────────
  const $modeFromTop = document.getElementById('modeFromTop');
  const $modeSeamless = document.getElementById('modeSeamless');
  function setMode(fromTop) {
    if (locked) return;
    restartOnSwitch = fromTop;
    $modeFromTop.classList.toggle('active', fromTop);
    $modeSeamless.classList.toggle('active', !fromTop);
  }
  $modeFromTop.addEventListener('click', () => setMode(true));
  $modeSeamless.addEventListener('click', () => setMode(false));

  // ─── UI ──────────────────────────────────────────────────────────
  function setActiveTrackUI() {
    $selector.querySelectorAll('.sel-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.idx, 10) === activeTrack);
    });
  }

  function updateTransportUI() {
    $playBtn.textContent = isPlaying ? 'PAUSE' : 'PLAY';
  }

  function onSceneStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
      killCaptions();
      if (!ccKilledOnce) { setTimeout(killCaptions, 800); ccKilledOnce = true; }
    }
    if (e.data === YT.PlayerState.ENDED) {
      musicPlayers.forEach(p => { try { p.pauseVideo(); } catch (err) {} });
      isPlaying = false;
      showCover('END');
      updateTransportUI();
    }
  }

  // ─── VOLUME KNOB INTERACTION ─────────────────────────────────────
  let knobDragging = false, knobStartY = 0, knobStartVal = 100;
  $knob.addEventListener('pointerdown', (e) => {
    if (locked) return;
    knobDragging = true;
    knobStartY = e.clientY;
    knobStartVal = masterVol;
    try { $knob.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  $knob.addEventListener('pointermove', (e) => {
    if (!knobDragging) return;
    const dy = knobStartY - e.clientY;   // drag up = louder
    masterVol = Math.max(0, Math.min(100, Math.round(knobStartVal + dy)));
    setKnobVisual();
    applyMasterVol();
  });
  function endKnobDrag(e) {
    knobDragging = false;
    if (e && e.pointerId != null) { try { $knob.releasePointerCapture(e.pointerId); } catch (_) {} }
  }
  $knob.addEventListener('pointerup', endKnobDrag);
  $knob.addEventListener('pointercancel', endKnobDrag);
  $knob.addEventListener('wheel', (e) => { e.preventDefault(); if (locked) return; nudgeVol(e.deltaY < 0 ? 1 : -1); }, { passive: false });
  $knob.addEventListener('keydown', (e) => {
    if (locked) return;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { nudgeVol(2); e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { nudgeVol(-2); e.preventDefault(); }
  });

  // ─── WIRE UP ─────────────────────────────────────────────────────
  $playBtn.addEventListener('click', togglePlay);
  $restartBtn.addEventListener('click', restart);
  // Shield is fully inert: video clicks do nothing. Pausing lives in the
  // transport only, so YouTube never sees a click and never shows chrome.
  $shield.addEventListener('click', (e) => e.preventDefault());
  setKnobVisual();
  buildDom();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
