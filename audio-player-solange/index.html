<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solange from Casino Royale - David Arnold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1E1A17;
    --text: #EAE0D0;
    --text-dim: rgba(234, 224, 208, 0.55);
    --text-faint: rgba(234, 224, 208, 0.3);
    --accent: #C07838;
    --accent-glow: #D8904A;
    --border: rgba(234, 224, 208, 0.15);
    --border-bright: rgba(234, 224, 208, 0.32);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: transparent;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* rack card: outer dark frame with an inner 1px light stroke inset from the edge */
  .rack {
    position: relative;
    width: 100%;
    max-width: 820px;
    background: var(--bg);
    border: 1px solid var(--border-bright);
    border-radius: 22px;
    padding: 18px 26px 20px;
  }
  .rack::before {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px solid var(--border);
    border-radius: 16px;
    pointer-events: none;
  }

  .inner { position: relative; z-index: 1; }

  /* ─── METADATA ─── */
  .meta {
    margin-bottom: 15px;
    padding-bottom: 13px;
    border-bottom: 1px solid var(--border);
  }
  .meta-title {
    font-size: 15px;
    line-height: 1.3;
    color: var(--text);
  }

  /* ─── TRANSPORT ─── */
  .row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .playbtn {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid var(--border-bright);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.05s;
  }
  .playbtn:hover { border-color: var(--accent); }
  .playbtn:active { transform: translateY(1px); }
  .playbtn svg { width: 20px; height: 20px; display: none; fill: currentColor; }
  .playbtn[data-state="idle"] .ico-play,
  .playbtn[data-state="paused"] .ico-play { display: block; }
  .playbtn[data-state="playing"] .ico-pause { display: block; }
  .playbtn[data-state="done"] .ico-replay { display: block; }
  .playbtn[data-state="playing"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 14px rgba(216, 144, 74, 0.28);
  }

  /* EQ playing indicator */
  .eq {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 22px;
    opacity: 0.35;
    transition: opacity 0.2s;
  }
  .eq span { width: 3px; height: 5px; background: var(--accent); border-radius: 1px; }
  .rack.playing .eq { opacity: 0.85; }
  .rack.playing .eq span { animation: bounce 900ms ease-in-out infinite; }
  .rack.playing .eq span:nth-child(2) { animation-delay: 140ms; }
  .rack.playing .eq span:nth-child(3) { animation-delay: 300ms; }
  .rack.playing .eq span:nth-child(4) { animation-delay: 90ms; }
  @keyframes bounce { 0%, 100% { height: 5px; } 50% { height: 20px; } }

  /* progress (display only) */
  .meter { flex: 1; min-width: 40px; }
  .track { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .fill {
    height: 100%; width: 0%;
    background: var(--accent); border-radius: 2px;
    transition: width 0.12s linear, background 0.4s;
  }
  .rack.fading .fill { background: var(--accent-glow); }

  /* time readout */
  .time {
    flex: none;
    font-family: 'Courier New', monospace;
    font-size: 14px; letter-spacing: 0.04em; white-space: nowrap;
  }
  .time .elapsed { color: var(--accent); text-shadow: 0 0 8px rgba(216, 144, 74, 0.35); }
  .time .total { color: var(--text-faint); }

  /* divider */
  .vrule { flex: none; width: 1px; height: 26px; background: var(--border); }

  /* ─── VOLUME FADER (drag / scroll / arrow keys, no jump-on-click) ─── */
  .vol {
    flex: none;
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: default;
    outline: none;
  }
  .vol .spk { width: 16px; height: 16px; fill: var(--text-dim); flex: none; transition: fill 0.15s; }
  .vol.muted .spk { fill: var(--text-faint); }
  .vol:focus-visible .spk { fill: var(--accent); }

  .vol-track {
    position: relative;
    width: 104px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
  }
  .vol-fill {
    position: absolute; left: 0; top: 0; height: 100%;
    width: 100%;
    background: var(--accent);
    border-radius: 2px;
  }
  .vol-handle {
    position: absolute;
    top: 50%;
    left: 100%;
    width: 11px;
    height: 17px;
    transform: translate(-50%, -50%);
    background: var(--bg);
    border: 1px solid var(--border-bright);
    border-radius: 3px;
    cursor: grab;
    touch-action: none;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .vol-handle::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 1px; height: 8px;
    background: var(--text-dim);
    transform: translate(-50%, -50%);
  }
  .vol-handle:hover,
  .vol.dragging .vol-handle { border-color: var(--accent); }
  .vol.dragging .vol-handle {
    cursor: grabbing;
    box-shadow: 0 0 10px rgba(216, 144, 74, 0.4);
  }
  .vol-handle::after { transition: background 0.12s; }
  .vol.dragging .vol-handle::after,
  .vol-handle:hover::after { background: var(--accent); }

  @media (max-width: 520px) {
    .row { gap: 14px; }
    .eq { display: none; }
    .rack { padding: 16px 18px 18px; }
    .vol-track { width: 78px; }
  }
</style>
</head>
<body>
  <div class="rack" id="rack">
    <div class="inner">

      <div class="meta">
        <div class="meta-title">Solange from Casino Royale - David Arnold</div>
      </div>

      <div class="row">
        <button class="playbtn" id="playBtn" data-state="idle" aria-label="Play">
          <svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          <svg class="ico-replay" viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>

        <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

        <div class="meter"><div class="track"><div class="fill" id="fill"></div></div></div>

        <div class="time"><span class="elapsed" id="elapsed">0:00</span><span class="total" id="total"> / 0:00</span></div>

        <div class="vrule" aria-hidden="true"></div>

        <div class="vol" id="vol" role="slider" tabindex="0"
             aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70">
          <svg class="spk" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.05A4.5 4.5 0 0016.5 12zm-2.5-9v2.06a7 7 0 010 13.87V22a9 9 0 000-19z"/></svg>
          <div class="vol-track" id="volTrack">
            <div class="vol-fill" id="volFill"></div>
            <div class="vol-handle" id="volHandle"></div>
          </div>
        </div>
      </div>

      <div class="yt-host" style="position:absolute;left:0;bottom:0;width:1px;height:1px;overflow:hidden;pointer-events:none;">
        <div id="ytHost"></div>
      </div>

    </div>
  </div>

<script>
  // ─── CONFIG ──────────────────────────────────────────────────────
  // This is a no-fade player: the source plays from the top at the fader
  // level, with no volume automation. Change these to reuse it elsewhere.
  const VIDEO_ID = 'f_NpqG0E1Tk';
  const START_AT = 0;    // seconds. playback begins here. 0 = top of the track

  // Full track length, discovered from the source once it is ready, used to
  // scale the progress bar and time readout.
  let scale = 0;

  // ─── STATE ───────────────────────────────────────────────────────
  let player = null;
  let ready = false;
  let ticker = null;
  let lastVol = -1;
  let finished = false;
  let started = false; // true once playback has entered at START_AT
  let userVol = 70;    // fader position, 0..100. The fade-in ramps up to this.
  let dragging = false;

  // ─── DOM ─────────────────────────────────────────────────────────
  const $rack    = document.getElementById('rack');
  const $playBtn = document.getElementById('playBtn');
  const $fill    = document.getElementById('fill');
  const $elapsed = document.getElementById('elapsed');
  const $total   = document.getElementById('total');
  const $vol     = document.getElementById('vol');
  const $volTrack  = document.getElementById('volTrack');
  const $volFill   = document.getElementById('volFill');
  const $volHandle = document.getElementById('volHandle');

  $total.textContent = ' / 0:00';
  paintVol();

  // ─── YOUTUBE IFRAME API ──────────────────────────────────────────
  (function loadApi() {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  })();

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('ytHost', {
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 0, controls: 0, disablekb: 1, fs: 0,
        cc_load_policy: 0, iv_load_policy: 3, modestbranding: 1, rel: 0, playsinline: 1
      },
      events: { onReady: onReady, onStateChange: onState }
    });
  };

  function onReady() {
    ready = true;
    player.setVolume(userVol);
    lastVol = userVol;
    grabScale();
  }

  // The source only reports its length once metadata has loaded, which can be
  // a beat after onReady. Poll until it is known, then set the readout scale.
  function grabScale() {
    if (scale > 0 || !ready || !player.getDuration) return;
    const d = player.getDuration();
    if (d > 0) {
      scale = d;
      $total.textContent = ' / ' + fmt(scale - START_AT);
    }
  }

  function onState(e) {
    const S = YT.PlayerState;
    if (e.data === S.PLAYING) {
      setBtn('playing'); $rack.classList.add('playing'); startTicker();
    } else if (e.data === S.PAUSED) {
      if (finished) return;
      setBtn('paused'); $rack.classList.remove('playing', 'fading'); stopTicker();
    } else if (e.data === S.ENDED) {
      finish();
    } else if (e.data === S.BUFFERING) {
      startTicker();
    }
  }

  // ─── TRANSPORT ───────────────────────────────────────────────────
  $playBtn.addEventListener('click', function () {
    if (!ready) return;

    if (finished) {                    // replay from the top
      finished = false;
      started = true;
      lastVol = -1;
      player.seekTo(START_AT, true);
      applyVolume();
      player.playVideo();
      return;
    }

    if (player.getPlayerState() === YT.PlayerState.PLAYING) {
      player.pauseVideo();
      return;
    }

    if (!started) {                    // first play
      started = true;
      lastVol = -1;
      player.seekTo(START_AT, true);
    }
    applyVolume();
    player.playVideo();
  });

  function startTicker() { if (!ticker) ticker = setInterval(tick, 80); }
  function stopTicker() { clearInterval(ticker); ticker = null; }

  function tick() {
    if (!ready) return;
    if (scale === 0) grabScale();
    updateProgress(safeTime());
  }

  // ─── VOLUME + FADE ───────────────────────────────────────────────
  // No fade: effective volume is always the fader level.
  function applyVolume() {
    if (userVol !== lastVol) { player.setVolume(userVol); lastVol = userVol; }
  }

  function safeTime() {
    return (ready && player.getCurrentTime) ? (player.getCurrentTime() || 0) : 0;
  }

  function finish() {
    finished = true;
    stopTicker();
    setBtn('done');
    $rack.classList.remove('playing', 'fading');
    const span = (scale > 0) ? (scale - START_AT) : 0;
    $fill.style.width = '100%';
    $elapsed.textContent = fmt(span);
  }

  function updateProgress(t) {
    const rel = Math.max(0, t - START_AT);
    const span = (scale > 0) ? (scale - START_AT) : 0;
    const pct = span > 0 ? Math.min(100, (rel / span) * 100) : 0;
    $fill.style.width = pct + '%';
    $elapsed.textContent = fmt(span > 0 ? Math.min(rel, span) : rel);
  }

  // ─── FADER CONTROL ───────────────────────────────────────────────
  function setUserVol(v) {
    userVol = Math.max(0, Math.min(100, Math.round(v)));
    paintVol();
    if (ready) { lastVol = -1; applyVolume(); }
  }

  function paintVol() {
    $volFill.style.width = userVol + '%';
    $volHandle.style.left = userVol + '%';
    $vol.setAttribute('aria-valuenow', userVol);
    $vol.classList.toggle('muted', userVol === 0);
  }

  // drag: starts on the handle only, so clicking the track never jumps the value
  $volHandle.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    dragging = true;
    $vol.classList.add('dragging');
    $volHandle.setPointerCapture(e.pointerId);
  });
  $volHandle.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    const r = $volTrack.getBoundingClientRect();
    setUserVol(((e.clientX - r.left) / r.width) * 100);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    $vol.classList.remove('dragging');
    try { $volHandle.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  $volHandle.addEventListener('pointerup', endDrag);
  $volHandle.addEventListener('pointercancel', endDrag);

  // scroll wheel over the control
  $vol.addEventListener('wheel', function (e) {
    e.preventDefault();
    setUserVol(userVol + (e.deltaY < 0 ? 4 : -4));
  }, { passive: false });

  // arrow keys when focused
  $vol.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { setUserVol(userVol + 4); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { setUserVol(userVol - 4); e.preventDefault(); }
    else if (e.key === 'Home') { setUserVol(0); e.preventDefault(); }
    else if (e.key === 'End') { setUserVol(100); e.preventDefault(); }
  });

  // ─── UI HELPERS ──────────────────────────────────────────────────
  function setBtn(state) {
    $playBtn.dataset.state = state;
    $playBtn.setAttribute('aria-label',
      state === 'playing' ? 'Pause' : state === 'done' ? 'Replay' : 'Play');
  }

  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60);
    const ss = String(s % 60).padStart(2, '0');
    return m + ':' + ss;
  }
</script>
</body>
</html>
